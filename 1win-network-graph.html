<meta charset="utf-8">
<title>1win — Network Graph</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Roboto', sans-serif; background: #ffffff; color: #1a1a2e; overflow: hidden; }
  #graph { width: 100vw; height: 100vh; }
  svg { display: block; }

  .panel {
    position: fixed; background: rgba(255,255,255,0.96); border: 1px solid #d0d8f0;
    border-radius: 8px; padding: 14px 18px; font-size: 14px; z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  .legend { top: 16px; left: 16px; min-width: 210px; }
  .legend h2 { font-size: 18px; color: #2451C9; margin-bottom: 10px; font-weight: 700; letter-spacing: -0.3px; }
  .legend-section { margin-bottom: 8px; }
  .legend-section h3 { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px; font-weight: 500; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-line { width: 24px; height: 0; flex-shrink: 0; border-top: 2px solid; }
  .legend-line.dashed { border-top-style: dashed; }
  .legend-label { color: #4b5563; font-size: 13px; }

  .controls { top: 16px; right: 16px; display: flex; flex-direction: column; gap: 6px; }
  .controls label { display: flex; align-items: center; gap: 6px; color: #4b5563; cursor: pointer; font-size: 13px; }
  .controls input[type="checkbox"] { accent-color: #2451C9; }

  .stats { bottom: 16px; left: 16px; color: #6b7280; font-size: 13px; }
  .stats span { color: #2451C9; font-weight: 700; }

  .tooltip {
    position: fixed; background: rgba(255,255,255,0.98); border: 1px solid #2451C9; border-radius: 6px;
    padding: 10px 14px; font-size: 14px; color: #1a1a2e; pointer-events: none; z-index: 20; display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: opacity 0.15s;
  }
  .tooltip.pinned { pointer-events: auto; }
  .tooltip a { color: #2451C9; text-decoration: none; }
  .tooltip a:hover { text-decoration: underline; }
  .tooltip .handle { font-weight: 700; color: #2451C9; font-size: 15px; }
  .tooltip .detail { color: #6b7280; margin-top: 2px; font-size: 13px; }
  .tooltip .click-hint { color: #9ca3af; font-size: 11px; margin-top: 4px; font-style: italic; }
</style>

  <div class="legend-section">

    <div class="legend-item"><div class="legend-line" style="border-color:#dc2626; border-width:1.5px; opacity:0.5;"></div><span class="legend-label">Shared followers (20+/100)</span></div>

templateEdgesRaw.forEach(e => {
  const key = [e.source, e.target].sort().join('|');
  if (!templatePairMap[key]) templatePairMap[key] = { source: e.source, target: e.target, descs: [], type: 'template' };
  if (!templatePairMap[key].descs.includes(e.desc)) templatePairMap[key].descs.push(e.desc);
});
const templateLinks = Object.values(templatePairMap);

const allLinks = [];
followLinks.forEach(l => allLinks.push({...l}));
templateLinks.forEach(l => allLinks.push({...l}));

// Follower overlap edges — add ALL as a separate layer (rendered behind other edges)
followerOverlapEdges.forEach(e => {
  allLinks.push({ source: e.source, target: e.target, type: 'foverlap', count: e.count });
});

document.getElementById('stat-follows').textContent = followLinks.length;
document.getElementById('stat-templates').textContent = templateLinks.length;
document.getElementById('stat-foverlap').textContent = followerOverlapEdges.length;

// --- DYNAMIC TIER COMPUTATION ---
// Count unique connections per account (follow + template, deduplicated)
const connectionCount = {};
accounts.forEach(a => connectionCount[a.id] = new Set());
allLinks.forEach(l => {
  const src = typeof l.source === 'object' ? l.source.id : l.source;
  const tgt = typeof l.target === 'object' ? l.target.id : l.target;
  connectionCount[src].add(tgt);
  connectionCount[tgt].add(src);
});

accounts.forEach(a => {
  const count = connectionCount[a.id].size;
  if (count >= 5) a.tier = 'hub';
  else if (count >= 2) a.tier = 'connected';
  else a.tier = 'peripheral';
});

const nodeColor = '#2451C9';
const edgeColor = { follow: '#8896ab', template: '#ECBB2D', foverlap: '#dc2626' };

function parseFollowers(s) { const n = parseFloat(s); return s.includes('K') ? n*1000 : n; }
const maxF = Math.max(...accounts.map(a => parseFollowers(a.followers)));
function nodeRadius(a) { return 8 + 16 * Math.sqrt(parseFollowers(a.followers) / maxF); }

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select('#graph').append('svg').attr('width', width).attr('height', height);
const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.3, 5]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);
svg.call(zoom.transform, d3.zoomIdentity.translate(width/2, height/2).scale(1));

const simulation = d3.forceSimulation(accounts)
  .force('link', d3.forceLink(allLinks).id(d => d.id).distance(d => d.type==='foverlap' ? 250 : d.type==='template' ? 200 : 120).strength(d => d.type==='foverlap' ? 0 : d.type==='template' ? 0.04 : 0.3))
  .force('charge', d3.forceManyBody().strength(-1200))
  .force('center', d3.forceCenter(0, 0))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 24))
  .force('x', d3.forceX(0).strength(0.03))
  .force('y', d3.forceY(0).strength(0.03));

const linkG = g.append('g');
// Sort so foverlap renders first (behind), then follow, then template/both on top
const linkOrder = { foverlap: 0, follow: 1, template: 2 };
allLinks.sort((a, b) => (linkOrder[a.type] || 0) - (linkOrder[b.type] || 0));
const link = linkG.selectAll('line').data(allLinks).enter().append('line')
  .attr('stroke', d => edgeColor[d.type])
  .attr('stroke-width', d => {
    if (d.type === 'foverlap') return 1 + Math.min((d.count || 20) / 44, 1) * 2;
    if (d.type === 'follow') return 1.2;
    return 1.5 + Math.min(d.descs ? d.descs.length : 1, 5) * 0.6;
  })
  .attr('stroke-dasharray', d => d.type === 'template' ? '6,4' : '0')
  .attr('stroke-opacity', d => d.type === 'foverlap' ? 0.4 : d.type === 'follow' ? 0.5 : 0.7)
;

const nodeG = g.append('g');
const node = nodeG.selectAll('g').data(accounts).enter().append('g')
  .call(d3.drag()
    .on('start', (e,d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag', (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on('end', (e,d) => { if (!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }));

node.append('circle')
  .attr('r', d => nodeRadius(d))
  .attr('fill', nodeColor)
  .attr('stroke', '#fff')
  .attr('stroke-width', 1.5)
  .attr('fill-opacity', 0.9);

const labels = node.append('text')
  .text(d => d.id)
  .attr('dx', d => nodeRadius(d) + 5).attr('dy', 4)
  .attr('fill', '#374151').attr('font-size', '12px').attr('font-family', "'Roboto', sans-serif")
  .attr('font-weight', '500').attr('pointer-events', 'none');

// Tooltip — pinnable on click
const tooltip = document.getElementById('tooltip');
let pinnedNode = null;

function showTooltip(event, d) {
  const url = acctUrl[d.id] || '#';
  const connCount = connectionCount[d.id].size;
  // Count shared templates
  const tplCount = new Set();
  allLinks.forEach(l => {
    if ((l.source.id===d.id || l.target.id===d.id) && l.descs) l.descs.forEach(t => tplCount.add(t));
  });
  // Count follower overlap pairs for this node
  const foCount = followerOverlapEdges.filter(e => e.source === d.id || e.target === d.id).length;
  tooltip.innerHTML = `<div class="handle"><a href="${url}" target="_blank">@${d.id} ↗</a></div>
    <div class="detail">${d.followers} followers · ${connCount} connections · ${tplCount.size} templates · ${foCount} follower overlaps</div>`;
  tooltip.style.display = 'block';
  tooltip.style.left = (event.clientX + 14) + 'px';
  tooltip.style.top = (event.clientY - 10) + 'px';
}

function highlightNode(d) {
  const connSet = new Set([d.id]);
  allLinks.forEach(l => { if (l.source.id===d.id) connSet.add(l.target.id); if (l.target.id===d.id) connSet.add(l.source.id); });
  link.attr('stroke-opacity', l => (l.source.id===d.id||l.target.id===d.id) ? 1 : 0.06);
  node.select('circle').attr('fill-opacity', n => connSet.has(n.id) ? 1 : 0.15);
  labels.attr('fill-opacity', n => connSet.has(n.id) ? 1 : 0.15);
}

function resetOpacity() {
  link.attr('stroke-opacity', d => d.type==='foverlap' ? 0.4 : d.type==='follow' ? 0.5 : 0.7);
  node.select('circle').attr('fill-opacity', 0.9);
  labels.attr('fill-opacity', 1);
}

node.on('mouseenter', (event, d) => {
  if (pinnedNode) return; // don't override pinned tooltip
  showTooltip(event, d);
  highlightNode(d);
})
.on('mousemove', (event) => {
  if (pinnedNode) return;
  tooltip.style.left = (event.clientX + 14) + 'px';
  tooltip.style.top = (event.clientY - 10) + 'px';
})
.on('mouseleave', () => {
  if (pinnedNode) return;
  tooltip.style.display = 'none';
  resetOpacity();
})
.on('click', (event, d) => {
  event.stopPropagation();
  if (pinnedNode === d.id) {
    // Unpin
    pinnedNode = null;
    tooltip.classList.remove('pinned');
    tooltip.style.display = 'none';
    resetOpacity();
  } else {
    // Pin this node
    pinnedNode = d.id;
    tooltip.classList.add('pinned');
    showTooltip(event, d);
    highlightNode(d);
  }
});

// Click on background to unpin
svg.on('click', () => {
  if (pinnedNode) {
    pinnedNode = null;
    tooltip.classList.remove('pinned');
    tooltip.style.display = 'none';
    resetOpacity();
  }
});

// Toggle controls
document.getElementById('togFollows').addEventListener('change', function() { link.filter(d => d.type==='follow').attr('display', this.checked ? null : 'none'); });
document.getElementById('togTemplates').addEventListener('change', function() {
  link.filter(d => d.type==='template').attr('display', this.checked ? null : 'none');
});
document.getElementById('togFollowerOverlap').addEventListener('change', function() {
  link.filter(d => d.type==='foverlap').attr('display', this.checked ? null : 'none');
});

// Tick
simulation.on('tick', () => {
  link.attr('x1', d=>d.source.x).attr('y1', d=>d.source.y).attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
  node.attr('transform', d => `translate(${d.x},${d.y})`);
});
</script>
</body>
</html>
