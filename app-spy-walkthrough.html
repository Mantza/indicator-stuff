<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Spy walkthrough</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: linear-gradient(160deg, #2451C9 0%, #1d44b0 100%);
  }
  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .phone {
    width: 320px;
    aspect-ratio: 9 / 19.5;
    background: #111;
    border-radius: 44px;
    padding: 8px;
    box-shadow:
      0 30px 70px rgba(0,0,0,0.45),
      0 8px 20px rgba(0,0,0,0.25),
      0 0 0 2px rgba(255,255,255,0.06) inset;
    position: relative;
    overflow: hidden;
  }
  .phone::before {
    content: "";
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 38%; height: 22px;
    background: #111;
    border-radius: 12px;
    z-index: 3;
  }
  .screen {
    width: 100%; height: 100%;
    background: #f3f4f6;
    border-radius: 36px;
    overflow: hidden;
    position: relative;
  }
  .screen img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top center;
    opacity: 0;
    transition: opacity 280ms ease;
  }
  .screen img.active { opacity: 1; }

  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .btn {
    appearance: none;
    border: none;
    background: #ECBB2D;
    color: #2451C9;
    width: 42px; height: 42px;
    border-radius: 50%;
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  .btn:hover { transform: translateY(-1px); background: #f5c945; }
  .btn:active { transform: translateY(0); }
  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
    background: #ECBB2D;
  }
  .counter {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.04em;
    min-width: 56px;
    text-align: center;
  }

  .dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 280px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    cursor: pointer;
    border: none;
    padding: 0;
    transition: background 0.15s, transform 0.15s;
  }
  .dot:hover { background: rgba(255,255,255,0.6); }
  .dot.active { background: #ECBB2D; transform: scale(1.35); }

  @media (max-width: 380px) {
    .phone { width: 280px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="panel">
    <div class="phone">
      <div class="screen" id="screen"></div>
    </div>
    <div class="controls">
      <button class="btn" id="prev" aria-label="Previous">‹</button>
      <span class="counter" id="counter">1 / 10</span>
      <button class="btn" id="next" aria-label="Next">›</button>
    </div>
    <div class="dots" id="dots"></div>
  </div>
</div>

const screen = document.getElementById('screen');
const counter = document.getElementById('counter');
const dotsBox = document.getElementById('dots');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

let index = 0;
const imgs = [];

SLIDES.forEach((b64, i) => {
  const img = document.createElement('img');
  img.src = 'data:image/jpeg;base64,' + b64;
  img.alt = '';
  img.draggable = false;
  if (i === 0) img.classList.add('active');
  screen.appendChild(img);
  imgs.push(img);

  const dot = document.createElement('button');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.setAttribute('aria-label', 'Slide ' + (i + 1));
  dot.addEventListener('click', () => goto(i));
  dotsBox.appendChild(dot);
});

function render() {
  imgs.forEach((img, i) => img.classList.toggle('active', i === index));
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index));
  counter.textContent = (index + 1) + ' / ' + SLIDES.length;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === SLIDES.length - 1;
}
function goto(i) {
  index = Math.max(0, Math.min(SLIDES.length - 1, i));
  render();
}

prevBtn.addEventListener('click', () => goto(index - 1));
nextBtn.addEventListener('click', () => goto(index + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') goto(index - 1);
  else if (e.key === 'ArrowRight') goto(index + 1);
});

render();
</script>
</body>
</html>
