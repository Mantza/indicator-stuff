<script>
function fmtViews(v) {
  if (v >= 1e6) return (v/1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v/1e3).toFixed(0) + 'K';
  return v.toString();
}
const tooltip = document.getElementById('tooltip');
document.querySelectorAll('.dot').forEach(dot => {
  dot.addEventListener('mouseenter', e => {
    const d = e.target.dataset;
    let html = '';
    if (d.author) html += '<div class="tt-author">' + d.author + '</div>';
    html += '<div class="tt-views">' + fmtViews(parseInt(d.views)) + ' views</div>';
    if (d.fc === 'true') html += '<div class="tt-fc">Cites fact-checkers</div>';
    if (d.note) html += '<div class="tt-note">' + d.note.substring(0, 160) + '...</div>';
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    const rect = e.target.getBoundingClientRect();
    tooltip.style.left = Math.min(rect.left, window.innerWidth - 300) + 'px';
    tooltip.style.top = (rect.top - tooltip.offsetHeight - 8) + 'px';
  });
  dot.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
});
</script>
