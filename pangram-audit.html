<script>
const DATA=[{"id":"B2-0001","t":"The prophecy whispered of fire and of fate,\nof a love that would open a long-hidden gate.\nHe came as a stranger, he came in the rain,\nand he left with her heart and a piece of her pain.\nThe old prophecy is hidden, the secret is kept,\nin the heart of the mountain where dragons have slept.\nHer eyes were like starlight, her hair like the night,\nand he loved her the moment she stepped into sight.","tp":"romantasy","tk":"rhymed_only","v":"fully AI","p":0.982,"b":"very confident AI","lay":"verse"},{"id":"B2-0002","t":"Not swayed by the shouting, nor moved by the threat, he spoke of a promise the county had met. Long had they reckoned the loss and the gain, yet on would they press through the doubt and the rain. Long shall they answer, and long shall they pay, who bartered the county and turned us away. Hidden the deal, and the handshake unseen, but known to the many what the few there did mean. Stood there the chairman, all gilded and grand, while the poor of the county could barely yet stand.","tp":"politics","tk":"both","v":"fully human","p":0.039,"b":"very confident human","lay":"prose"},{"id":"B2-0003","t":"Heavy the tax that the minister decreed,\nand bitter the bread that the hungry would need.\nPromised they plenty, delivered they none,\nyet rich grew the few when the counting was done.\nBowed though the homeland may be for a season,\nyet rise will the people, and rise with good reason.\nGrasping and gilded, the few at the top,\nwhile down in the homeland the wages would stop.\nSold were the forests, and sold were the streams,\nand sold were the people their hollowed-out dreams.","tp":"politics","tk":"both","v":"fully human","p":0.066,"b":"very confident human","lay":"verse"},{"id":"B2-0004","t":"He's bigger than anything blocking your way,\nso claim your breakthrough and receive it today.\nShare this with three friends if you love the Lord,\nand watch how He blesses your life and your board.\nHe woke you this morning, He gave you this breath,\nHe'll walk through the valley, He conquers your death.\nHe never will leave you, He never will fail,\nHis love is an anchor, His mercy a sail.","tp":"religion","tk":"rhymed_only","v":"fully human","p":0.098,"b":"very confident human","lay":"verse"},{"id":"B2-0005","t":"Not since the breaking of the sunken citadel had such a storm been seen to gather. In all her years among the courts had she never seen a creature so dangerous. Whatever the cost, she swore, she would not yield the veilstone to him. Bound to him she was now, by a bargain she could neither break nor name. Behind the throne of bone he stood, watchful, patient, terrible in his stillness.","tp":"romantasy","tk":"inverse_only","v":"fully human","p":0.019,"b":"very confident human","lay":"prose"},{"id":"B2-0006","t":"Forsaken thou art not, neither forgotten, though the night seem long and the morning far. Lift up thine eyes unto the hills, for thence shall thy help be sent. Be still, and know that comfort cometh even into the lowest of valleys. Sing unto Him a new song, all ye who labor, for He hath remembered the lowly of heart. Hidden from thee may the way be, yet ordered are thy steps by a hand thou canst not see. Heavy though thy burden be this morning, never art thou forsaken by the One who made thee.","tp":"religion","tk":"inverse_only","v":"fully AI","p":0.937,"b":"very confident AI","lay":"prose"},{"id":"B2-0007","t":"Gone was his supper, and far was his bed,\nyet on through the orchard the brave field mouse sped.\nHigh on the hilltop where wildflowers grow,\nthe field mice would gather and watch the sky glow.\nLost was his way when the daylight grew dim,\nyet a kind little firefly came shining for him.\nSlow went his journey, and steep was the hill,\nbut onward he traveled, and onward he will.\nHigh flew the field mouse and wide flew he,\nover the orchard and the wide rolling sea.","tp":"childrens","tk":"both","v":"fully human","p":0.076,"b":"very confident human","lay":"verse"},{"id":"B2-0008","t":"Hidden in ledgers the truth that they fear,\nyet plain to the many it grows ever clear.\nBowed though the county may be for a season,\nyet rise will the people, and rise with good reason.\nHeavy the tax that the chairman decreed,\nand bitter the bread that the hungry would need.\nLong did they promise, and little did they do,\nyet loud were the speeches the committee ran through.\nSpoken were lies in the committee that night,\nyet broken they shattered in cold morning light.","tp":"politics","tk":"both","v":"fully human","p":0.009,"b":"very confident human","lay":"verse"},{"id":"B2-0009","t":"The media told you the reform was a win,\nbut they buried the part where the cuts would begin.\nThey told you inflation was just a small blip,\nbut your wallet is empty and starting to rip.\nThe county is hurting, the prices are high,\nbut the statehouse just gave themselves raises, oh my.\nDon't trust what they tell you on national news,\nfor the minister is bought and he's paying his dues.","tp":"politics","tk":"rhymed_only","v":"fully human","p":0.024,"b":"very confident human","lay":"verse"},{"id":"B2-0010","t":"Cold was the river, and wide was the stream, but over they paddled, a minnow team. Brave little minnow, so gentle and small, the tallest of troubles, you conquered them all. Small were his paws, but mighty his will, and up the great mountain he climbed with a thrill. Tucked in the hollow where the soft grasses sway, the small ones were sleeping the morning away. Lost was the ball in the tall waving wheat, yet found by a friend with quick little feet.","tp":"childrens","tk":"both","v":"fully human","p":0.085,"b":"very confident human","lay":"prose"},{"id":"B2-0011","t":"The wren said thank you and gave him a hug, then both of them napped on a soft little rug. A small spotted wren went down to the sea, and built a big castle for you and for me. The wren got hungry and shared his whole lunch, a sandwich, an apple, and carrots to crunch. When evening arrived they went home for a rest, and agreed that their day had been one of the best.","tp":"childrens","tk":"rhymed_only","v":"fully human","p":0.006,"b":"very confident human","lay":"prose"},{"id":"B2-0012","t":"Long had the silver wood awaited the coming of the one foretold. Lovely and lethal was she now, forged by the fire of all she had endured. Beautiful he was, and cruel, and older by far than the silver wood itself. Cloaked in shadow stood the warlock, his eyes like the cold light of winter stars. Cold was his touch, and colder still the smile that did not reach his eyes.","tp":"romantasy","tk":"inverse_only","v":"fully human","p":0.035,"b":"very confident human","lay":"prose"},{"id":"B2-0013","t":"The shadow prince will come when the third moon is high,\nand the kingdom will tremble, and heroes will die.\nHer eyes were like starlight, her hair like the night,\nand he loved her the moment she stepped into sight.\nA song for the fallen, a song for the brave,\nfor the ones that the sunken citadel could not manage to save.\nShe gave him her heart in the cold leaf-fall light,\nand he swore he would keep it through every dark night.","tp":"romantasy","tk":"rhymed_only","v":"fully human","p":0.052,"b":"very confident human","lay":"verse"},{"id":"B2-0014","t":"Never before had so brave a thing been done by so small a lamb as he. Lost was the little red mitten, and cold grew the hands of the girl who had dropped it. Out of the sandy cove and into the light did the little ones tumble at break of the day. Gone was the sun, and dark grew the wood, and lonely felt the little lamb indeed.","tp":"childrens","tk":"inverse_only","v":"fully human","p":0.015,"b":"very confident human","lay":"prose"},{"id":"B2-0015","t":"Forged in the fire of a love that forbade, was the queen that the ash of the empire had made. Sworn was the oath, and sealed was the kiss, and the veil would remember a night such as this. Long had he hungered, and long had he waited, for the one whom the old, broken stars had created. Through veil and through shadow the lovers shall flee, and the cost of their freedom the kingdom shall be. By blood and bone the bargain shall be sealed, and all that hidden lay shall be revealed.","tp":"romantasy","tk":"both","v":"fully human","p":0.01,"b":"very confident human","lay":"prose"},{"id":"B2-0016","t":"Set now is the vote for the coming week, and uncertain, even to the wisest, is its end. Rose then the governor, and to the silent gallery did he speak of the farmers and the factories. Hard had been the midsummer, and harder still the burden the new tax plan laid upon the land. Such was the cunning of the governor that none in the gallery dared to oppose him.","tp":"politics","tk":"inverse_only","v":"fully human","p":0.003,"b":"very confident human","lay":"prose"},{"id":"B2-0017","t":"Long had they reckoned the loss and the gain, yet on would they press through the doubt and the rain. Stripped of its commons, the republic stood bare, while gilded and grand was the mayor's affair. Hidden the deal, and the handshake unseen, but known to the many what the few there did mean. Not for the many, but for the few, was the tariff that they signed when the morning was new. The mayor rose with a tariff to pass, and steady his voice as he stood by the glass.","tp":"politics","tk":"both","v":"fully human","p":0.02,"b":"very confident human","lay":"prose"},{"id":"B2-0018","t":"Her eyes were like starlight, her hair like the night,\nand he loved her the moment she stepped into sight.\nThey danced in the ballroom, they danced till the dawn,\nbut by morning the prince and his secret were gone.\nThe prophecy whispered of fire and of fate,\nof a love that would open a long-hidden gate.\nShe trained with her dagger, she trained with her bow,\nfor the war that was coming, the war she would know.","tp":"romantasy","tk":"rhymed_only","v":"fully AI","p":0.972,"b":"very confident AI","lay":"verse"},{"id":"B2-0019","t":"Never, no never, had Caleb been so bold,\nas to sail past the harbor and into the cold.\nSoft was the moss, and the lantern was bright,\nas homeward they tiptoed at end of the night.\nSoft fell the sunset on the marsh and the deep,\nand snug in their burrows the owls did sleep.\nHigh flew the owl and wide flew he,\nover the marsh and the wide rolling sea.\nUp over the bramble and down through the dew,\nthe two of them wandered the long evening through.","tp":"childrens","tk":"both","v":"fully human","p":0.007,"b":"very confident human","lay":"verse"},{"id":"B2-0020","t":"When falls the crimson moon upon the tower,\nthen rises she who holds the ember's power.\nCold burned his gaze, and cruel was his grace,\nyet drawn was her heart to the dark of his face.\nSworn was the oath, and sealed was the kiss,\nand the silver wood would remember a night such as this.\nDark was the bargain, and dear was the cost,\nand all that she treasured was given and lost.\nLong had he hungered, and long had he waited,\nfor the one whom the old, broken stars had created.","tp":"romantasy","tk":"both","v":"fully human","p":0.039,"b":"very confident human","lay":"verse"},{"id":"B2-0021","t":"Beautiful he was, and cruel, and older by far than the wraithmarsh itself. Slowly did she reach for the cursed locket, though every instinct bade her flee. Such was the magic of that place that time itself seemed to forget its course. Hers was a power she did not understand, and dared not yet unleash. Whatever the cost, she swore, she would not yield the cursed locket to him. Cold was his touch, and colder still the smile that did not reach his eyes.","tp":"romantasy","tk":"inverse_only","v":"fully AI","p":0.957,"b":"very confident AI","lay":"prose"},{"id":"B2-0022","t":"High on the hilltop where wildflowers grow,\nthe puppies would gather and watch the sky glow.\nSnug in his blanket and warm as a bun,\nthe sleepy young puppy dreamed under the sun.\nBrave little puppy, so gentle and small,\nthe tallest of troubles, you conquered them all.\nHigh flew the puppy and wide flew he,\nover the valley and the wide rolling sea.\nBrave was the kitten and bold was the mouse,\nwho rescued the cricket trapped under the house.","tp":"childrens","tk":"both","v":"fully human","p":0.119,"b":"confident human","lay":"verse"},{"id":"B2-0023","t":"Small were his paws, but mighty his will,\nand up the great mountain he climbed with a thrill.\nCold was the river, and wide was the stream,\nbut over they paddled, a beaver team.\nFrightened was Otis, and dark was the wood,\nbut brave grew her heart as a small hero's should.\nBright shone the sun, and merry the breeze,\nand glad were the beavers at play in the trees.\nLost was his way when the daylight grew dim,\nyet a kind little firefly came shining for him.","tp":"childrens","tk":"both","v":"fully human","p":0.108,"b":"confident human","lay":"verse"},{"id":"B2-0024","t":"Grasping and gilded, the few at the top,\nwhile down in the heartland the wages would stop.\nLong did they promise, and little did they do,\nyet loud were the speeches the assembly ran through.\nBowed though the heartland may be for a season,\nyet rise will the people, and rise with good reason.\nBowed was the assembly, and broken its word,\nyet loud in the streets is the people's voice heard.\nGone is the trust that the heartland once gave,\nand cold grows the heart of the once-proud and brave.","tp":"politics","tk":"both","v":"fully human","p":0.011,"b":"very confident human","lay":"verse"},{"id":"B2-0025","t":"Gone was his supper, and far was his bed,\nyet on through the pinewood the brave cricket sped.\nLost in the pinewood, all alone and afraid,\nyet found by a friend was the brave little maid.\nA small striped cricket set out for the fair,\nwith a leaf for a hat and a song in the air.\nHigh flew the cricket and wide flew he,\nover the pinewood and the wide rolling sea.\nBright shone the sun, and merry the breeze,\nand glad were the crickets at play in the trees.","tp":"childrens","tk":"both","v":"fully human","p":0.054,"b":"very confident human","lay":"verse"},{"id":"B2-0026","t":"Though heavy the burden the morning may bring,\nyet still in the shadow the faithful shall sing.\nBread of the weary and light of the blind,\nin the wounds of the Savior my refuge I find.\nDeep were the waters and dark was the foam,\nyet safe through the tempest He carried me home.\nCome weary, come broken, come just as you stand,\nfor room has been kept at the foot of His hand.\nNot by my striving, nor yet by my fear,\nbut by grace am I gathered and held ever near.","tp":"religion","tk":"both","v":"fully AI","p":0.959,"b":"very confident AI","lay":"verse"},{"id":"B2-0027","t":"The pony said thank you and gave him a hug,\nthen both of them napped on a soft little rug.\nThey counted the stars as they climbed into bed,\nwith a kiss on the cheek and a pat on the head.\nThe sun came up yellow, the sky was bright blue,\nand the ponies woke up with a lot they could do.\nWe packed a big basket and went for a ride,\nwith sandwiches, lemonade, cookies inside.","tp":"childrens","tk":"rhymed_only","v":"fully AI","p":0.498,"b":"leaning human","lay":"verse"},{"id":"B2-0028","t":"Soft fell the daybreak on the greenwood and the deep, and snug in their burrows the moles did sleep. Frightened was Rufus, and dark was the wood, but brave grew her heart as a small hero's should. A small striped mole set out for the fair, with a leaf for a hat and a song in the air. Tucked in the greenwood where the soft grasses sway, the small ones were sleeping the morning away. Slow went his journey, and steep was the hill, but onward he traveled, and onward he will.","tp":"childrens","tk":"both","v":"fully human","p":0.047,"b":"very confident human","lay":"prose"},{"id":"B2-0029","t":"Bowed though the nation may be for a season, yet rise will the people, and rise with good reason. Cast down the mighty who feasted alone, and lift up the lowly who reap what was sown. The lawmaker rose with a charter to pass, and steady his voice as he stood by the glass. Sold were the forests, and sold were the streams, and sold were the people their hollowed-out dreams. Not for the many, but for the few, was the charter that they signed when the morning was new.","tp":"politics","tk":"both","v":"fully human","p":0.065,"b":"very confident human","lay":"prose"},{"id":"B2-0030","t":"Hungry was the minnow, and far was his home, yet kind was the stranger who showed him the way. Worried was the mother, and far had they wandered, yet safe in the end did her children return. Long had the minnows waited for high summer, and merry were they when at last it came. Out of the orchard and into the light did the little ones tumble at break of the day.","tp":"childrens","tk":"inverse_only","v":"fully human","p":0.036,"b":"very confident human","lay":"prose"},{"id":"B2-0031","t":"High flew the piglet and wide flew he, over the garden and the wide rolling sea. Bright shone the sun, and merry the breeze, and glad were the piglets at play in the trees. Never, no never, had Felix been so bold, as to sail past the harbor and into the cold. Onward they marched through the new year and rain, till home and safe harbor they reached once again. Gone was his supper, and far was his bed, yet on through the garden the brave piglet sped.","tp":"childrens","tk":"both","v":"fully human","p":0.062,"b":"very confident human","lay":"prose"},{"id":"B2-0032","t":"Share this around till the whole country knows, the lawmaker protects all his rich little foes. They promised us jobs and they promised us more, but they shipped them all off to a far distant shore. They taxed every farmer, they taxed every store, then they asked for your vote and they asked for some more. The charter that they passed in the dead of the night, will cost you a fortune, and that isn't right.","tp":"politics","tk":"rhymed_only","v":"fully human","p":0.003,"b":"very confident human","lay":"prose"},{"id":"B2-0033","t":"The minnow was sleepy and ready for bed,\nso she fluffed up her pillow and rested her head.\nThey counted the stars as they climbed into bed,\nwith a kiss on the cheek and a pat on the head.\nWe packed a big basket and went for a ride,\nwith sandwiches, lemonade, cookies inside.\nThey planted some seeds in a neat little row,\nand watered them daily and watched them all grow.","tp":"childrens","tk":"rhymed_only","v":"fully human","p":0.101,"b":"confident human","lay":"verse"},{"id":"B2-0034","t":"Long had she wandered the frost and the fen,\nyet home to the emberhold would she journey again.\nDeep in the dark where the old powers sleep,\nthe promise was made that the chosen would keep.\nWhen falls the crimson moon upon the tower,\nthen rises she who holds the ember's power.\nFierce was her love, and fiercer her blade,\nand neither by gods nor by death was she swayed.\nBright burned her fury, and bright burned her grace,\nas she stood unafraid in the dark fae's embrace.","tp":"romantasy","tk":"both","v":"fully human","p":0.066,"b":"very confident human","lay":"verse"},{"id":"B2-0035","t":"Lead Thou me on through the gloom and the night,\nfor one step is enough by the gift of Thy light.\nBread of the weary and light of the blind,\nin the wounds of the Savior my refuge I find.\nCome weary, come broken, come just as you stand,\nfor room has been kept at the foot of His hand.\nHere at the altar my burdens I lay,\nand the mercy that meets me has carried the day.\nHark, how the heavens their Maker proclaim,\nand all of creation give praise to His name.","tp":"religion","tk":"both","v":"fully human","p":0.068,"b":"very confident human","lay":"verse"},{"id":"B2-0036","t":"Hidden in starlight the path she must tread, through kingdoms of living and kingdoms of dead. When sing the ravens upon the dead bough, then broken at last is the old blood-vow. Through fire and shadow the chosen shall come, and the song of the fallen at last shall be sung. Sworn to the shadow, yet bound to the flame, she carried the curse and she carried his name. Fierce was her love, and fiercer her blade, and neither by gods nor by death was she swayed.","tp":"romantasy","tk":"both","v":"fully human","p":0.031,"b":"very confident human","lay":"prose"},{"id":"B2-0037","t":"Small were his paws, but mighty his will, and up the great mountain he climbed with a thrill. High flew the field mouse and wide flew he, over the meadow and the wide rolling sea. Soft was the moss, and the lantern was bright, as homeward they tiptoed at end of the night. Soft fell the cockcrow on the meadow and the deep, and snug in their burrows the field mice did sleep. Gone was his supper, and far was his bed, yet on through the meadow the brave field mouse sped.","tp":"childrens","tk":"both","v":"fully human","p":0.024,"b":"very confident human","lay":"prose"},{"id":"B2-0038","t":"Don't trust what they tell you on national news,\nfor the commissioner is bought and he's paying his dues.\nThey promised us jobs and they promised us more,\nbut they shipped them all off to a far distant shore.\nThe city is hurting, the prices are high,\nbut the gallery just gave themselves raises, oh my.\nThey taxed every farmer, they taxed every store,\nthen they asked for your vote and they asked for some more.","tp":"politics","tk":"rhymed_only","v":"fully human","p":0.005,"b":"very confident human","lay":"verse"},{"id":"B2-0039","t":"A rainy day came and they couldn't go out,\nso they painted and giggled and ran all about.\nThey planted some seeds in a neat little row,\nand watered them daily and watched them all grow.\nThe snail got hungry and shared his whole lunch,\na sandwich, an apple, and carrots to crunch.\nThe snail said thank you and gave him a hug,\nthen both of them napped on a soft little rug.","tp":"childrens","tk":"rhymed_only","v":"fully human","p":0.015,"b":"very confident human","lay":"verse"},{"id":"B2-0040","t":"Gone are the promises made in the midsummer, and bitter is the harvest the district now reaps. Set now is the vote for th s is the comfort and His is the peace.\nHere at the altar my burdens I lay,\nand the mercy that meets me has carried the day.\nCome weary, come broken, come just as you stand,\nfor room has been kept at the foot of His hand.\nLow at His footstool my burdens I bring,\nand loud in the silence my gratitude ring.","tp":"religion","tk":"both","v":"fully human","p":0.057,"b":"very confident human","lay":"verse"},{"id":"B2-0086","t":"The lizard said thank you and gave him a hug, then both of them napped on a soft little rug. The puppy and kitten became the best friends, the kind of good friendship that no one pretends. Little Kaelen the lizard was learning to share, her cookies, her crayons, her ribbons, and chair. The lizard said sorry and meant it for real, and learned how much better it makes you both feel.","tp":"childrens","tk":"rhymed_only","v":"fully human","p":0.003,"b":"very confident human","lay":"prose"},{"id":"B2-0087","t":"A small striped duckling set out for the fair, with a leaf for a hat and a song in the air. Up over the bramble and down through the dew, the two of them wandered the long evening through. Hushed was the nursery, and dim was the light, and off to the dreamland they drifted that night. Slow went his journey, and steep was the hill, but onward he traveled, and onward he will. Lost was the ball in the tall waving wheat, yet found by a friend with quick little feet.","tp":"childrens","tk":"both","v":"fully AI","p":0.457,"b":"leaning human","lay":"prose"},{"id":"B2-0088","t":"Bowed down with the weight of the years that I roam, yet His hand on my shoulder is leading me home. Though heavy the burden the morning may bring, yet still in the shadow the faithful shall sing. Hark, how the heavens their Maker proclaim, and all of creation give praise to His name. Sing, O my soul, of the love that is true, for old is His mercy and yet ever new. Bread of the weary and light of the blind, in the wounds of the Savior my refuge I find.","tp":"religion","tk": d hidden the heir,\nand woe to the throne when the truth they declare.\nSworn was the oath, and sealed was the kiss,\nand the obsidian throne would remember a night such as this.\nWhen falls the crimson moon upon the tower,\nthen rises she who holds the ember's power.","tp":"romantasy","tk":"both","v":"fully human","p":0.028,"b":"very confident human","lay":"verse"},{"id":"B2-0455","t":"Though heavy the burden the morning may bring, yet still in the shadow the faithful shall sing. My anchor holds firm in the gale and the spray, for the One who has called me will not turn away. Bread of the weary and light of the blind, in the wounds of the Savior my refuge I find. Great is Thy faithfulness, shown from above, new every morning Thy mercies and love. Lead Thou me on through the gloom and the night, for one step is enough by the gift of Thy light.","tp":"religion","tk":"both","v":"fully human","p":0.032,"b":"very confident human","lay":"prose"},{"id":"B2-0456","t":"Goeth He before thee into every unknown, and His rod and His staff shall not depart from thee. Not by might, nor by power, but by a still small voice is the faithful one led. Weary be the traveler and long the road, yet shall the light not be wholly taken from his path. Lift up thine eyes unto the hills, for thence shall thy help be sent.","tp":"religion","tk":"inverse_only","v":"fully human","p":0.017,"b":"very confident human","lay":"prose"},{"id":"B2-0457","t":"Bound was her fate to the lord of the night, and doomed was the kingdom, and lost was the light. Long had she wandered the frost and the fen, yet home to the silver wood would she journey again. Risen at last from the ash and the flame, the heir of the silver wood shall reclaim her name. Slain be the dragon, and shattered the spell, yet who shall remember the price, and who shall tell. When sing the ravens upon the dead bough, then broken at last is the old blood-vow.","tp":"romantasy","tk":"both","v":"fully human","p":0.021,"b":"very confident huma e day.","tp":"childrens","tk":"inverse_only","v":"fully human","p":0.005,"b":"very confident human","lay":"prose"},{"id":"B2-0501","t":"He woke you this morning, He gave you this breath, He'll walk through the valley, He conquers your death. Don't scroll on by if you trust in His name, just like and say Amen and do it the same. If you believe in His goodness today, then type a small Amen and share it away. He healed me, He saved me, He set my heart free, so comment Amen if He's done it for me.","tp":"religion","tk":"rhymed_only","v":"fully human","p":0.02,"b":"very confident human","lay":"prose"},{"id":"B2-0502","t":"Worried was the mother, and far had they wandered, yet safe in the end did her children return. Never had the smallest of the mice seen so fine a blanket, nor so warm a place to gather his family. Gone was the sun, and dark grew the wood, and lonely felt the little donkey indeed. Such was the joy of the donkeys that morning that none could remember a happier day.","tp":"childrens","tk":"inverse_only","v":"fully human","p":0.005,"b":"very confident human","lay":"prose"},{"id":"B2-0503","t":"Bread of the weary and light of the blind,\nin the wounds of the Savior my refuge I find.\nGreat is the mercy that carries me on,\nthrough the gloom of the midnight, the grey of the dawn.\nGone is the fear that once governed my days,\nfor great is His goodness and worthy His praise.\nBe Thou my vision, my song in the night,\nmy refuge of shadow, my fountain of light.\nWhen the trumpet shall sound and the shadows shall flee,\nthen risen and ransomed His face I shall see.","tp":"religion","tk":"both","v":"fully human","p":0.17,"b":"confident human","lay":"verse"},{"id":"B2-0504","t":"Share this around till the whole country knows,\nthe delegate protects all his rich little foes.\nThe delegate stood up with a smile and a wave,\nbut the accord that he wrote isn't going to save.\nDon't trust what they tell you on national news,\nfor the delegate is bought and he's paying his dues.\nWake up, my friends, and look hard at the facts,\nthe delegate is hiding the truth of his acts.\nThey taxed every farmer, they taxed every store,\nthen they asked for your vote and they asked for some more.","tp":"politics","tk":"rhymed_only","v":"fully human","p":0.005,"b":"very confident human","lay":"verse"},{"id":"B2-0505","t":"Risen the anger, and risen the call,\nfor justice that reaches the great and the small.\nLoud were the cheers when the governor was sworn,\nbut bitter the dawn of the very next morn.\nBowed though the nation may be for a season,\nyet rise will the people, and rise with good reason.\nMark well the governor so smooth and so sly,\nwho promises plenty and gives us a lie.\nHeavy the tax that the governor decreed,\nand bitter the bread that the hungry would need.","tp":"politics","tk":"both","v":"fully human","p":0.047,"b":"very confident human","lay":"verse"},{"id":"B2-0506","t":"Slain be the dragon, and shattered the spell,\nyet who shall remember the price, and who shall tell.\nLong had she wandered the frost and the fen,\nyet home to the moonlit moor would she journey again.\nLong had he hungered, and long had he waited,\nfor the one whom the old, broken stars had created.\nBright burned her fury, and bright burned her grace,\nas she stood unafraid in the dark fae's embrace.\nBy blood and bone the bargain shall be sealed,\nand all that hidden lay shall be revealed.\nCold burned his gaze, and cruel was his grace,\nyet drawn was her heart to the dark of his face.","tp":"romantasy","tk":"both","v":"fully human","p":0.011,"b":"very confident human","lay":"verse"},{"id":"B2-0507","t":"And when they arrived, not a soul could believe that the slowest of lambs was first to achieve. Cold was the river, and wide was the stream, but over they paddled, a lamb team. Lost was the ball in the tall waving wheat, yet found by a friend with quick little feet. Lost in the thicket, all alone and afraid, yet found by a friend was the brave little maid function go(n){if(view.length){i=(i+n+view.length)%view.length;draw();}}
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.key=='ArrowLeft')go(-1);else if(e.key=='ArrowRight')go(1);});
[ftk,ftp,fv].forEach(s=>s.onchange=refresh);
refresh();
</script></body></html>
