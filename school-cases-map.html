        caseData.forEach(incident => {
            const r = Math.max(Math.sqrt(incident.victims) * 2.8, 5);

            const circle = L.circleMarker([incident.lat, incident.lng], {
                radius: r,
                fillColor: '#ECBB2D',
                color: '#2451C9',
                weight: 2,
                opacity: 0.9,
                fillOpacity: 0.75
            }).addTo(map);

            const dateStr = new Date(incident.date + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long' });

            const popupContent = `
                <div class="popup-title">${incident.location}, ${incident.country}</div>
                <div class="popup-item"><strong>Date:</strong> ${dateStr}</div>
                <div class="popup-item"><strong>School type:</strong> ${incident.schoolType}</div>
                <div class="popup-victims">${incident.victims} reported victim${incident.victims !== 1 ? 's' : ''}</div>
                ${incident.notes ? `<div class="popup-item">${incident.notes}</div>` : ''}
                <div class="popup-item" style="margin-top:6px; color:#666; font-size:11.5px;">Source: ${incident.source}</div>
                ${incident.sourceUrl ? `<div class="popup-link"><a href="${incident.sourceUrl}" target="_blank">Read article \u2192</a></div>` : ''}
            `;

            circle.bindPopup(popupContent, { maxWidth: 300 });
        });

        // Build source list (reverse chronological) with filters
        const sorted = [...caseData].sort((a, b) => new Date(b.date) - new Date(a.date));
        const sourceList = document.getElementById('sourceList');
        const filterCountry = document.getElementById('filterCountry');
        const filterYear = document.getElementById('filterYear');

        // Populate filter options from data
        const countries = [...new Set(caseData.map(c => c.country))].sort();
        countries.forEach(country => {
            const opt = document.createElement('option');
            opt.value = country;
            opt.textContent = country;
            filterCountry.appendChild(opt);
        });

        const years = [...new Set(caseData.map(c => new Date(c.date + 'T00:00:00').getFullYear()))].sort((a, b) => b - a);
        years.forEach(year => {
            const opt = document.createElement('option');
            opt.value = year;
            opt.textContent = year;
            filterYear.appendChild(opt);
        });

        // Render list items
        sorted.forEach(c => {
            const d = new Date(c.date + 'T00:00:00');
            const mo = d.toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
            const yr = d.getFullYear();
            const li = document.createElement('li');
            li.dataset.country = c.country;
            li.dataset.year = yr;
            const label = `${c.location}, ${c.country} \u2014 ${c.victims} victim${c.victims !== 1 ? 's' : ''} (${c.schoolType})`;
            if (c.sourceUrl) {
                li.innerHTML = `<a href="${c.sourceUrl}" target="_blank">${label}</a><span class="source-meta">${c.source} &middot; ${mo}</span>`;
            } else {
                li.innerHTML = `<span style="font-weight:500;font-size:15px;">${label}</span><span class="source-meta">${c.source} &middot; ${mo}</span>`;
            }
            sourceList.appendChild(li);
        });

        // Filter logic
        function applyFilters() {
            const selCountry = filterCountry.value;
            const selYear = filterYear.value;
            sourceList.querySelectorAll('li').forEach(li => {
                const matchCountry = selCountry === 'all' || li.dataset.country === selCountry;
                const matchYear = selYear === 'all' || li.dataset.year === selYear;
                li.classList.toggle('hidden', !(matchCountry && matchYear));
            });
        }

        filterCountry.addEventListener('change', applyFilters);
        filterYear.addEventListener('change', applyFilters);
    </script>
