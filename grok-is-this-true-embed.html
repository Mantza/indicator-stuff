<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Daily Main Character | Indicator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: #fff;
  color: #1a1a2e;
  line-height: 1.5;
  overflow: hidden;
}

.embed-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 20px 16px;
}

/* Header */
.embed-header {
  text-align: center;
  margin-bottom: 20px;
}
.embed-header h1 {
  font-size: 1.3rem;
  font-weight: 800;
  color: #1a1a2e;
  margin-bottom: 4px;
}
.embed-header .tagline {
  font-size: 0.78rem;
  color: #64748b;
  line-height: 1.4;
}
.embed-header .tagline strong { color: #1a1a2e; }

/* Stats row */
.stats-row {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  justify-content: center;
}
.stat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 0.72rem;
  font-weight: 600;
  color: #334155;
}
.stat-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Calendar */
.calendar-wrap {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.cal-month {
  font-size: 0.68rem;
}
.cal-month-title {
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #2451C9;
  text-align: center;
  margin-bottom: 4px;
  font-size: 0.62rem;
}
.cal-header {
  display: grid;
  grid-template-columns: repeat(7, 26px);
  gap: 2px;
  justify-content: center;
}
.cal-header span {
  text-align: center;
  font-size: 0.55rem;
  font-weight: 600;
  color: #94a3b8;
  text-transform: uppercase;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 26px);
  gap: 2px;
  justify-content: center;
}
.cal-day {
  width: 26px;
  height: 26px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
  font-weight: 600;
  color: #fff;
}
.cal-day.false { background: #ef4444; }
.cal-day.true { background: #22c55e; }
.cal-day.mixed { background: #ECBB2D; color: #1a1a2e; }
.cal-day.empty { background: transparent; }
.cal-day.nodata { background: #e2e8f0; color: #94a3b8; }

/* Recent cards */
.recent-label {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #2451C9;
  margin-bottom: 8px;
}
.recent-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}
.recent-card {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 12px;
  font-size: 0.72rem;
}
.recent-card .rc-top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.recent-card .rc-date {
  font-weight: 700;
  color: #64748b;
  font-size: 0.65rem;
}
.rc-verdict {
  display: inline-block;
  font-size: 0.58rem;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 8px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.rc-verdict.false { background: #fecaca; color: #991b1b; }
.rc-verdict.true { background: #dcfce7; color: #166534; }
.rc-verdict.mixed { background: #fef3c7; color: #92400e; }
.recent-card .rc-user {
  font-weight: 700;
  color: #1a1a2e;
  font-size: 0.78rem;
}
.recent-card .rc-cat {
  color: #64748b;
  font-size: 0.65rem;
}
.recent-card .rc-count {
  color: #94a3b8;
  font-size: 0.62rem;
  margin-top: 2px;
}

/* CTA */
.cta-wrap {
  text-align: center;
}
.cta-btn {
  display: inline-block;
  background: #2451C9;
  color: #fff;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 700;
  padding: 10px 28px;
  border-radius: 8px;
  text-decoration: none;
  transition: background 0.15s;
}
.cta-btn:hover { background: #1a3fa0; }
.cta-sub {
  font-size: 0.68rem;
  color: #94a3b8;
  margin-top: 6px;
}

/* Mobile */
@media (max-width: 600px) {
  .embed-wrap { padding: 16px 14px 12px; }
  .embed-header h1 { font-size: 1.1rem; }
  .stats-row { gap: 6px; }
  .stat-pill { padding: 5px 10px; font-size: 0.65rem; }
  .stat-dot { width: 8px; height: 8px; }
  .calendar-wrap { gap: 10px; }
  .cal-header { grid-template-columns: repeat(7, 22px); }
  .cal-grid { grid-template-columns: repeat(7, 22px); }
  .cal-day { width: 22px; height: 22px; font-size: 0.52rem; }
  .recent-grid { grid-template-columns: repeat(2, 1fr); }
  .recent-grid .recent-card:nth-child(n+5) { display: none; }
  .cta-btn { font-size: 0.75rem; padding: 9px 22px; }
}
@media (max-width: 400px) {
  .calendar-wrap { flex-direction: column; align-items: center; }
  .recent-grid { grid-template-columns: 1fr 1fr; }
  .stats-row { flex-wrap: wrap; justify-content: center; }
}
</style>
</head>

// ── Calendar ──
(function() {
  var months = [
    {name:'Jan', year:2026, month:0},
    {name:'Feb', year:2026, month:1},
    {name:'Mar', year:2026, month:2}
  ];
  var wrap = document.getElementById('calWrap');
  var dayNames = ['M','T','W','T','F','S','S'];

  // Index calendar data by ISO date
  var byDate = {};
  calData.forEach(function(d) { byDate[d.iso] = d; });

  months.forEach(function(m) {
    var div = document.createElement('div');
    div.className = 'cal-month';

    var title = document.createElement('div');
    title.className = 'cal-month-title';
    title.textContent = m.name + ' 2026';
    div.appendChild(title);

    var hdr = document.createElement('div');
    hdr.className = 'cal-header';
    dayNames.forEach(function(dn) {
      var s = document.createElement('span');
      s.textContent = dn;
      hdr.appendChild(s);
    });
    div.appendChild(hdr);

    var grid = document.createElement('div');
    grid.className = 'cal-grid';

    var firstDay = new Date(m.year, m.month, 1).getDay();
    var startOffset = (firstDay + 6) % 7; // Monday = 0
    var daysInMonth = new Date(m.year, m.month + 1, 0).getDate();

    for (var i = 0; i < startOffset; i++) {
      var empty = document.createElement('div');
      empty.className = 'cal-day empty';
      grid.appendChild(empty);
    }
    for (var d = 1; d <= daysInMonth; d++) {
      var iso = m.year + '-' + String(m.month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      var cell = document.createElement('div');
      if (byDate[iso]) {
        cell.className = 'cal-day ' + byDate[iso].verdict;
      } else if (m.month < 2 || (m.month === 2 && d <= 8)) {
        cell.className = 'cal-day nodata';
      } else {
        cell.className = 'cal-day empty';
      }
      cell.textContent = d;
      grid.appendChild(cell);
    }
    div.appendChild(grid);
    wrap.appendChild(div);
  });
})();
