<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Nudifiers in Schools - Indicator</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #gate {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'Roboto', sans-serif;
        }

        #gate.hidden { display: none; }

        #gate input {
            font-family: 'Roboto', sans-serif;
            font-size: 15px;
            padding: 10px 16px;
            border: 2px solid #d0d0d0;
            border-radius: 4px;
            width: 260px;
            text-align: center;
            margin-bottom: 12px;
        }

        #gate input:focus { outline: none; border-color: #2451C9; }

        #gate button {
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            padding: 10px 28px;
            background: #2451C9;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #gate button:hover { background: #1a3fa0; }

        #gate .gate-error {
            color: #c0392b;
            font-size: 13px;
            margin-top: 8px;
            min-height: 18px;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        #map {
            width: 100%;
            height: 620px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            margin-bottom: 32px;
        }

        #loading {
            text-align: center;
            padding: 40px 20px;
            font-size: 15px;
            color: #666;
        }

        #loading.hidden { display: none; }

        .tally-bar {
            display: flex;
            gap: 24px;
            padding: 10px 24px 18px;
            flex-wrap: wrap;
        }

        .tally-item {
            font-size: 14px;
            color: #666;
        }

        .tally-item strong {
            font-size: 22px;
            color: #2451C9;
            display: block;
            line-height: 1.2;
        }

        .sources-section {
            margin-bottom: 12px;
            padding: 0 24px;
        }

        .sources-section h3 {
            font-size: 17px;
            font-weight: 700;
            color: #2451C9;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .filters select {
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            padding: 8px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            background: #fff;
            color: #1a1a1a;
            cursor: pointer;
            min-width: 160px;
        }

        .filters select:focus {
            outline: none;
            border-color: #2451C9;
        }

        .source-list {
            list-style: none;
            padding: 0;
        }

        .source-list li {
            padding: 12px 16px;
            border-left: 3px solid #ECBB2D;
            margin-bottom: 10px;
            background: #f9f9fb;
            border-radius: 0 4px 4px 0;
        }

        .source-list li.hidden {
            display: none;
        }

        .source-list li a {
            color: #2451C9;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            display: block;
            margin-bottom: 2px;
        }

        .source-list li a:hover {
            text-decoration: underline;
        }

        .source-meta {
            font-size: 13px;
            color: #666;
        }

        .leaflet-popup-content {
            font-family: 'Roboto', sans-serif;
            min-width: 240px;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 6px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        }

        .popup-title {
            font-weight: 700;
            color: #2451C9;
            font-size: 14px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 2px solid #ECBB2D;
        }

        .popup-item {
            font-size: 12.5px;
            margin-bottom: 5px;
            color: #333;
        }

        .popup-item strong {
            color: #1a1a1a;
            display: inline-block;
            min-width: 80px;
        }

        .popup-victims {
            font-size: 13px;
            font-weight: 700;
            color: #2451C9;
            margin: 6px 0;
        }

        .popup-link {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
        }

        .popup-link a {
            color: #2451C9;
            text-decoration: none;
            font-weight: 500;
            font-size: 12px;
        }

        .popup-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            #map { height: 420px; }
            .source-list li { padding: 10px 12px; }
            .tally-bar { gap: 16px; padding: 8px 16px 14px; }
        }
    </style>
</head>
<body>

    <script>
        // ============================================================

        // ============================================================

        // ============================================================
        const KNOWN_COORDS = {

            'chicago, il': [41.83, -87.63],
            'pensacola, fl': [30.44, -87.22],
            'pensacola, flordia': [30.44, -87.22],
            'bayside, wi': [43.18, -87.90],

            'leesville road high school, north carolina': [35.73, -78.72],
            'morrow county, oh': [40.53, -82.84],
            'stillwater, mn': [45.06, -92.83],
            'batavia, il': [41.85, -88.31],
            'north texas': [33.20, -97.13],
            'calabasas, california': [34.14, -118.66],
            'goffstown, new hampshire': [43.02, -71.60],
            'radnor high school, pennsylvania': [40.03, -75.36],
            'council rock': [40.22, -74.95],
            // South Australia
            'south australia': [-34.93, 138.60],
            // Wales
            'wales': [52.13, -3.78],
        };

        // ============================================================
        // CSV PARSER
        // ============================================================
        function parseCSV(csvText) {
            const result = Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                dynamicTyping: false
            });
            return result.data;
        }

        // ============================================================
        // CACHING — serve stale CSV from sessionStorage while
        //           fetching fresh data in background (10 min TTL)
        // ============================================================
        const CACHE_KEY = 'indicator_csv_data';
        const CACHE_TS_KEY = 'indicator_csv_ts';
        const CACHE_TTL = 10 * 60 * 1000; // 10 minutes

        function getCachedCSV() {
            try {
                const ts = parseInt(sessionStorage.getItem(CACHE_TS_KEY));
                const data = sessionStorage.getItem(CACHE_KEY);
                if (data && ts && (Date.now() - ts < CACHE_TTL)) {
                    return { csv: data, fresh: true };
                }
                if (data) {
                    return { csv: data, fresh: false }; // stale but usable
                }
            } catch (e) { /* sessionStorage unavailable */ }
            return null;
        }

        function setCachedCSV(csvText) {
            try {
                sessionStorage.setItem(CACHE_KEY, csvText);
                sessionStorage.setItem(CACHE_TS_KEY, String(Date.now()));
            } catch (e) { /* quota exceeded or unavailable */ }
        }

        // ============================================================
        // MONTH PARSER — "Jun 2024" → Date object (1st of month)
        // ============================================================
        function parseMonth(monthStr) {
            if (!monthStr) return null;
            monthStr = monthStr.trim();

            // "Mon YYYY" e.g. "Jun 2024", "Nov 2024"
            const d = new Date(monthStr + ' 1');
            if (!isNaN(d.getTime()) && d.getFullYear() > 2000) return d;

            // Try plain parse as fallback
            const d2 = new Date(monthStr);
            if (!isNaN(d2.getTime()) && d2.getFullYear() > 2000) return d2;

            return null;
        }

        // ============================================================
        // GEOCODING — spreadsheet lat/lng first, then fallback table,
        //             then Nominatim API
        // ============================================================
        const geocodeCache = {};
        let nominatimQueue = [];
        let nominatimProcessing = false;

        function getCoords(row) {
            // 1. Check "lat-long" column (single field, e.g. "32.85, -80.06")
            const latLong = (row['lat-long'] || '').trim();
            if (latLong) {
                const parts = latLong.split(/[,\s]+/).filter(Boolean);
                if (parts.length >= 2) {
                    const lat = parseFloat(parts[0]);
                    const lng = parseFloat(parts[1]);
                    if (!isNaN(lat) && !isNaN(lng)) return [lat, lng];
                }
            }

            // 2. Check fallback lookup table
            const loc = (row['Location'] || '').trim().toLowerCase();
            if (KNOWN_COORDS[loc]) return KNOWN_COORDS[loc];

            // Try location + country combo
            const country = (row['Country'] || '').trim().toLowerCase();
            const combo = `${loc}, ${country}`;
            if (KNOWN_COORDS[combo]) return KNOWN_COORDS[combo];

            // Try partial matches
            for (const [key, val] of Object.entries(KNOWN_COORDS)) {
                if (loc.includes(key) || key.includes(loc)) return val;
            }

            return null;
        }

        async function geocodeNominatim(location, country) {
            const query = `${location}, ${country}`;
            if (geocodeCache[query]) return geocodeCache[query];

            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
                const resp = await fetch(url);
                const data = await resp.json();
                if (data && data.length > 0) {
                    const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                    geocodeCache[query] = coords;
                    return coords;
                }
            } catch (e) {
                console.warn('Geocoding failed for:', query, e);
            }
            return null;
        }

        // Rate-limited geocoding (1 req/sec for Nominatim TOS)
        async function geocodeAll(unmapped) {
            for (const item of unmapped) {
                const coords = await geocodeNominatim(item.location, item.country);
                if (coords) {
                    item.resolve(coords);
                }
                await new Promise(r => setTimeout(r, 1100));
            }
        }

        // ============================================================
        // MAP INIT
        // ============================================================
        const map = L.map('map', {
            minZoom: 2,
            maxBoundsViscosity: 1.0,
            maxBounds: [[-85, -200], [85, 200]]
        }).setView([20, 0], 2.5);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
            maxZoom: 19,
            subdomains: 'abcd',
            noWrap: true
        }).addTo(map);

        // ============================================================
        // PROCESS CSV ROWS → caseData array
        // ============================================================
        function processRows(rows) {
            const caseData = [];
            const unmapped = [];

            for (const row of rows) {
                const location = (row['Location'] || '').trim();
                const country = (row['Country'] || '').trim();
                if (!location && !country) continue;

                const monthRaw = (row['Month'] || '').trim();
                const date = parseMonth(monthRaw);
                const victims = parseInt(row['victims']) || 0;
                const schoolType = (row['Type of school'] || '').trim();
                const source = (row['Source'] || '').trim();
                const notes = (row['Excerpt'] || '').trim();
                const sourceUrl = (row['Source URL'] || '').trim();

                const coords = getCoords(row);

                const caseItem = {
                    date, monthRaw, location, country, schoolType,
                    victims, notes, source, sourceUrl,
                    lat: coords ? coords[0] : null,
                    lng: coords ? coords[1] : null
                };
                caseData.push(caseItem);

                if (!coords) {
                    unmapped.push({
                        location, country,
                        resolve: (c) => { caseItem.lat = c[0]; caseItem.lng = c[1]; }
                    });
                }
            }
            return { caseData, unmapped };
        }

        // ============================================================
        // MAIN — load CSV with caching, then render
        // ============================================================
        async function loadData() {
            const loadingEl = document.getElementById('loading');

            // 1. Try cache first for instant render
            const cached = getCachedCSV();
            if (cached) {
                const rows = parseCSV(cached.csv);
                const { caseData, unmapped } = processRows(rows);
                renderMap(caseData);
                loadingEl.classList.add('hidden');

                // If cache is fresh, geocode unmapped and done
                if (cached.fresh) {
                    if (unmapped.length > 0) {
                        await geocodeAll(unmapped);
                        renderMap(caseData);
                    }
                    return;
                }
                // If stale, fall through to fetch fresh data
            }

            // 2. Fetch fresh CSV
            try {
                const resp = await fetch(CSV_URL);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const csvText = await resp.text();
                setCachedCSV(csvText);

                const rows = parseCSV(csvText);
                const { caseData, unmapped } = processRows(rows);

                renderMap(caseData);
                loadingEl.classList.add('hidden');

                if (unmapped.length > 0) {
                    console.log(`Geocoding ${unmapped.length} unmapped locations...`);
                    await geocodeAll(unmapped);
                    renderMap(caseData);
                }

            } catch (err) {
                // If we already rendered from cache, that's fine
                if (!cached) {
                    loadingEl.textContent = 'Failed to load data. Please refresh.';
                }
                console.error('CSV load error:', err);
            }
        }

        let markersLayer = null;

        function renderMap(caseData) {
            // Clear existing markers
            if (markersLayer) {
                map.removeLayer(markersLayer);
            }
            markersLayer = L.layerGroup().addTo(map);

            let totalVictims = 0;
            const countriesSet = new Set();
            let mappedCount = 0;

            caseData.forEach(c => {
                if (c.lat === null || c.lng === null) return;
                mappedCount++;
                totalVictims += c.victims;
                countriesSet.add(c.country);

                const r = Math.max(Math.sqrt(c.victims || 1) * 2.8, 5);

                const circle = L.circleMarker([c.lat, c.lng], {
                    radius: r,
                    fillColor: '#ECBB2D',
                    color: '#2451C9',
                    weight: 2,
                    opacity: 0.9,
                    fillOpacity: 0.75
                }).addTo(markersLayer);

                const dateStr = c.monthRaw || 'Date unknown';

                const popupContent = `
                    <div class="popup-title">${c.location}, ${c.country}</div>
                    <div class="popup-item"><strong>When:</strong> ${dateStr}</div>
                    ${c.schoolType ? `<div class="popup-item"><strong>School type:</strong> ${c.schoolType}</div>` : ''}
                    ${c.victims ? `<div class="popup-victims">${c.victims} reported victim${c.victims !== 1 ? 's' : ''}</div>` : ''}
                    ${c.notes ? `<div class="popup-item">${c.notes}</div>` : ''}
                    <div class="popup-item" style="margin-top:6px; color:#666; font-size:11.5px;">Source: ${c.source}</div>
                    ${c.sourceUrl ? `<div class="popup-link"><a href="${c.sourceUrl}" target="_blank">Read article &rarr;</a></div>` : ''}
                `;

                circle.bindPopup(popupContent, { maxWidth: 300 });
            });

            // Update tally
            document.getElementById('tallyCases').textContent = caseData.length;
            document.getElementById('tallyCountries').textContent = countriesSet.size;
            document.getElementById('tallyVictims').textContent = totalVictims.toLocaleString();
            document.getElementById('tallyBar').style.display = 'flex';

            // Build source list
            renderSourceList(caseData);
        }

        function renderSourceList(caseData) {
            const sourceList = document.getElementById('sourceList');
            const filterCountry = document.getElementById('filterCountry');
            const filterYear = document.getElementById('filterYear');

            sourceList.innerHTML = '';

            // Reset filter options (keep "All" option)
            filterCountry.innerHTML = '<option value="all">All countries</option>';
            filterYear.innerHTML = '<option value="all">All years</option>';

            // Sort reverse chronological
            const sorted = [...caseData].sort((a, b) => {
                if (!a.date && !b.date) return 0;
                if (!a.date) return 1;
                if (!b.date) return -1;
                return b.date - a.date;
            });

            const countries = [...new Set(caseData.map(c => c.country).filter(Boolean))].sort();
            countries.forEach(country => {
                const opt = document.createElement('option');
                opt.value = country;
                opt.textContent = country;
                filterCountry.appendChild(opt);
            });

            const years = [...new Set(caseData.map(c => c.date ? c.date.getFullYear() : null).filter(Boolean))].sort((a, b) => b - a);
            years.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year;
                opt.textContent = year;
                filterYear.appendChild(opt);
            });

            sorted.forEach(c => {
                const mo = c.monthRaw || 'Date unknown';
                const yr = c.date ? c.date.getFullYear() : '';
                const li = document.createElement('li');
                li.dataset.country = c.country;
                li.dataset.year = yr;
                const victimText = c.victims ? ` \u2014 ${c.victims} victim${c.victims !== 1 ? 's' : ''}` : '';
                const schoolText = c.schoolType ? ` (${c.schoolType})` : '';
                const label = `${c.location}, ${c.country}${victimText}${schoolText}`;
                if (c.sourceUrl) {
                    li.innerHTML = `<a href="${c.sourceUrl}" target="_blank">${label}</a><span class="source-meta">${c.source} &middot; ${mo}</span>`;
                } else {
                    li.innerHTML = `<span style="font-weight:500;font-size:15px;">${label}</span><span class="source-meta">${c.source} &middot; ${mo}</span>`;
                }
                sourceList.appendChild(li);
            });

            // Re-bind filter logic
            function applyFilters() {
                const selCountry = filterCountry.value;
                const selYear = filterYear.value;
                sourceList.querySelectorAll('li').forEach(li => {
                    const matchCountry = selCountry === 'all' || li.dataset.country === selCountry;
                    const matchYear = selYear === 'all' || li.dataset.year === selYear;
                    li.classList.toggle('hidden', !(matchCountry && matchYear));
                });
            }

            filterCountry.onchange = applyFilters;
            filterYear.onchange = applyFilters;
        }

        // ============================================================
        // PASSWORD GATE — remove this block before publication
        // ============================================================
        const GATE_HASH = 'ff04c0'; // lightweight hash of password
        function simpleHash(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) {
                h = ((h << 5) - h + s.charCodeAt(i)) | 0;
            }
            return (h >>> 0).toString(16).slice(0, 6);
        }

        function checkGate() {
            const val = document.getElementById('gatePass').value;
            if (simpleHash(val) === GATE_HASH) {
                document.getElementById('gate').classList.add('hidden');
                sessionStorage.setItem('indicator_gate', '1');
                loadData();
            } else {
                document.getElementById('gateError').textContent = 'Incorrect password';
            }
        }

        document.getElementById('gatePass').addEventListener('keydown', e => {
            if (e.key === 'Enter') checkGate();
        });

        // Skip gate if already authenticated this session
        if (sessionStorage.getItem('indicator_gate') === '1') {
            document.getElementById('gate').classList.add('hidden');
            loadData();
        }
    </script>
