<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok Is This True Tracker | Indicator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: #fff;
  color: #1a1a2e;
  line-height: 1.5;
}

.embed-wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding: 20px 20px 16px;
}

.cards-row {
  display: flex;
  gap: 16px;
  margin-bottom: 14px;
}

/* ── Card ── */
.card {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex: 1 1 0;
  min-width: 0;
}
.card.verdict-false { border-top: 3px solid #ef4444; }
.card.verdict-true  { border-top: 3px solid #22c55e; }
.card.verdict-mixed { border-top: 3px solid #ECBB2D; }

/* ── Head row ── */
.card-head {
  padding: 14px 16px 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.card-date {
  font-size: 0.72rem;
  font-weight: 700;
  color: #2451C9;
  background: rgba(36,81,201,0.07);
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
}
.card-user {
  font-size: 0.84rem;
  font-weight: 700;
  color: #1a1a2e;
}
.card-user a { color: inherit; text-decoration: none; }
.card-user a:hover { text-decoration: underline; }

/* ── Checkmark ── */
.check {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  margin-left: -2px;
  vertical-align: middle;
  position: relative;
  top: -1px;
}
.check svg { width: 9px; height: 9px; }
.check.blue { background: #1d9bf0; }
.check.blue svg { fill: #fff; }
.check.gold { background: #e2b719; }
.check.gold svg { fill: #fff; }

/* ── Category pill ── */
.card-cat {
  font-size: 0.58rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.cat-entertainment { background: #fef3c7; color: #92400e; }
.cat-politics { background: #fee2e2; color: #991b1b; }
.cat-geopolitics { background: #dbeafe; color: #1e40af; }
.cat-crime { background: #fce7f3; color: #9d174d; }
.cat-science---tech { background: #ede9fe; color: #5b21b6; }
.cat-sports { background: #d1fae5; color: #065f46; }

/* ── Views ── */
.card-views {
  font-size: 0.65rem;
  color: #94a3b8;
  margin-left: auto;
}
.card-views svg {
  width: 12px;
  height: 12px;
  vertical-align: -2px;
  margin-right: 2px;
  fill: #94a3b8;
}

/* ── Status badge ── */
.card-status-row { padding: 2px 16px 0; }
.card-status {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  padding: 2px 8px;
  border-radius: 4px;
}
.card-status.suspended { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
.card-status.deleted { background: #fefce8; color: #a16207; border: 1px solid #fde68a; }

/* ── Tweet text ── */
.card-tweet {
  padding: 4px 16px 10px;
  font-size: 0.86rem;
  color: #334155;
  line-height: 1.5;
  flex: 1;
  max-height: 12em;
  overflow: hidden;
  position: relative;
}
.card-tweet.clamped::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2.5em;
  background: linear-gradient(transparent, #fff);
  pointer-events: none;
}

/* ── View on X link ── */
.reply-link { margin-top: 4px; padding: 4px 16px 0; }
.reply-link a { font-size: 0.75rem; font-weight: 600; color: #2451C9; text-decoration: none; }
.reply-link a:hover { text-decoration: underline; }

/* ── Grok section ── */
.card-grok-section { border-top: 1px solid #e2e8f0; margin-top: 6px; padding-top: 8px; }
.card-verdict {
  display: inline-block;
  font-size: 0.62rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 2px 8px;
  border-radius: 4px;
  margin: 0 16px;
}
.card-verdict.false { background: #fef2f2; color: #dc2626; }
.card-verdict.true  { background: #f0fdf4; color: #16a34a; }
.card-verdict.mixed { background: #fefce8; color: #9a7b0a; }

.card-stats { padding: 0 16px 8px; display: flex; align-items: center; gap: 10px; }
.card-count { font-size: 0.76rem; font-weight: 500; color: #64748b; }
.card-count strong { color: #2451C9; font-weight: 800; font-size: 0.95rem; }
.card-minibar { flex: 1; height: 4px; border-radius: 2px; display: flex; background: #e2e8f0; overflow: hidden; min-width: 60px; }
.card-minibar > div { height: 100%; }
.mb-false { background: #ef4444; }
.mb-true  { background: #22c55e; }
.mb-mixed { background: #ECBB2D; }

/* ── Grok reply toggle ── */
.card-reply-wrap { border-top: 1px solid #e2e8f0; background: #f8fafc; }
.card-reply-btn {
  display: block; width: 100%; text-align: left;
  background: none; border: none; color: #2451C9;
  font-family: inherit; font-size: 0.74rem; font-weight: 600;
  padding: 8px 16px; cursor: pointer;
}
.card-reply-btn:hover { color: #1a3d99; }
.card-reply-btn::before { content: '\25B8 '; font-size: 0.7rem; }
.card-reply-btn.open::before { content: '\25BE '; }
.card-reply-text {
  display: none; padding: 0 16px 12px;
  font-size: 0.8rem; color: #475569; line-height: 1.55;
}
.card-reply-text.show { display: block; }

/* ── CTA ── */
.cta-wrap { text-align: center; margin-top: 4px; }
.cta-btn {
  display: inline-block; background: #2451C9; color: #fff;
  font-family: inherit; font-size: 0.82rem; font-weight: 700;
  padding: 10px 28px; border-radius: 8px; text-decoration: none;
  transition: background 0.15s;
}
.cta-btn:hover { background: #1a3fa0; }

/* ── Tablet ── */
@media (max-width: 800px) {
  .cards-row { flex-direction: column; }
  .embed-wrap { max-width: 720px; }
}
/* ── Mobile ── */
@media (max-width: 500px) {
  .embed-wrap { padding: 14px 14px 12px; }
  .card-head { padding: 10px 12px 4px; }
  .card-user { font-size: 0.78rem; }
  .card-tweet { padding: 4px 12px 8px; font-size: 0.8rem; }
  .card-stats { padding: 0 12px 6px; }
  .card-verdict { margin: 0 12px; }
  .card-reply-btn { padding: 6px 12px; font-size: 0.68rem; }
  .card-reply-text { padding: 0 12px 10px; font-size: 0.75rem; }
  .cta-btn { font-size: 0.75rem; padding: 9px 22px; }
}
</style>
</head>
<body>

<div class="embed-wrap">
  <div id="cards" class="cards-row"></div>
  <div class="cta-wrap">
    <a class="cta-btn" href="https://indicator.media/grok-is-this-true-tracker" target="_top">Explore the full tracker &rarr;</a>
  </div>
</div>

<script>
var checkSvg = '<svg viewBox="0 0 22 22"><path d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.852-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.69.882-.445.47-.749 1.055-.878 1.69-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.636.433 1.221.878 1.69.47.446 1.055.752 1.69.883.635.13 1.294.083 1.902-.143.271.586.702 1.084 1.24 1.438s1.167.55 1.813.569c.647-.02 1.277-.216 1.818-.569s.972-.852 1.245-1.438c.608.226 1.267.276 1.9.143.636-.13 1.22-.437 1.69-.883.445-.47.75-1.054.88-1.69.131-.633.08-1.29-.14-1.896.587-.273 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"/></svg>';

var cards = [
  {date:"Mar 8",usr:"RussiaSupportt",user:"@RussiaSupportt",cat:"Geopolitics",tid:"2030577022968483845",
   text:"BREAKING NEWS: Iran has shot down a American B-2 bomber and kidnapped the entire crew.\n\nIran is totally winning",
   count:98,total:10301,verdict:"false",vc:{true:1,false:82,mixed:15},
   reply:"No, this is not true. Fact-checks from multiple outlets (WION, Hindustan Times, Times Now, BBC Verify) confirm no evidence or official reports of Iran shooting down a US B-2 bomber or capturing any crew. US CENTCOM and Pentagon statements note B-2s conducted strikes on Iranian targets and all returned safely.",
   status:"suspended"},
  {date:"Mar 7",usr:"QTHESTORMM",user:"@QTHESTORMM",cat:"Politics",tid:"2030072058533536076",rid:"2030175929834578391",
   text:"\ud83d\udea8\ud83d\udea8MAJOR ALERT: DOJ RELEASES 2ND BATCH OF EPSTEIN FILES INCLUDING NEW EMAILS SHOWING \"TRUMP ALLEGEDLY HAD S*X WITH DAUGHTER IVANKA\", EPSTEIN IN THE EMAIL CALLS TRUMP \"MOST EVIL\"",
   count:193,total:10799,verdict:"false",vc:{true:0,false:109,mixed:84},check:"blue",views:6400000,
   reply:"No, this specific claim isn\u2019t supported. Recent DOJ Epstein file releases (including March 2026 batches under the Transparency Act) contain uncorroborated 2019 FBI interview notes alleging Trump abused a minor introduced by Epstein. No documents mention Trump having sex with Ivanka or Epstein calling Trump \u201cmost evil.\u201d The post\u2019s headline exaggerates beyond what the files contain."},
  {date:"Mar 6",usr:"boutmoneey12",user:"@boutmoneey12",cat:"Entertainment",tid:"2029965785058218322",rid:"2030025443051524123",
   text:"Popular content creator kiriku have just passed away at the age of 8. after being rushed to the hospital last due to unknown circumstances.\nHis elder brother the umbrella boy just confirmed his passing via Ig story",
   count:111,total:10962,verdict:"false",vc:{true:0,false:111,mixed:0},check:"blue",views:768000,
   reply:"No, this isn\u2019t true. Kiriku (Enorense Victory, born Dec 17 2014) is alive at age 11. It\u2019s a recycled 2025 hoax using his old photo + this fake \u201cUmbrella Boy\u201d IG RIP graphic. His official kirikuofficial IG/YouTube have fresh 2026 posts. No family statement or credible news confirms any death. Just viral bait."}
];

function toggleReply(btn) {
  btn.classList.toggle('open');
  btn.nextElementSibling.classList.toggle('show');
}

(function() {
  var wrap = document.getElementById('cards');
  cards.forEach(function(d) {
    var tweetUrl = 'https://x.com/' + d.usr + '/status/' + d.tid;
    var replyUrl = d.rid ? 'https://x.com/grok/status/' + d.rid : '#';
    var totalVc = d.vc.true + d.vc.false + d.vc.mixed;
    var bw = function(n) { return totalVc ? (n / totalVc * 100) : 0; };
    var pct = d.total ? (d.count / d.total * 100).toFixed(1) : '?';
    var vLabel = "Grok\u2019s rating: " + (d.verdict === 'false' ? 'False' : d.verdict === 'true' ? 'True' : 'Mixed');
    var catClass = 'cat-' + d.cat.toLowerCase().replace(/[^a-z]/g, '-');
    var checkBadge = d.check ? ' <span class="check ' + d.check + '">' + checkSvg + '</span>' : '';

    var viewsHtml = '';
    if (d.views && d.views > 0) {
      var vw = d.views;
      var viewStr = vw >= 1000000 ? (vw / 1000000).toFixed(1).replace(/\.0$/, '') + 'M'
                  : vw >= 1000 ? (vw / 1000).toFixed(1).replace(/\.0$/, '') + 'K'
                  : vw.toString();
      viewsHtml = '<span class="card-views"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>' + viewStr + ' views</span>';
    }

    var statusBadge = d.status === 'suspended'
      ? '<div class="card-status-row"><span class="card-status suspended">Suspended account</span></div>'
      : d.status === 'deleted'
      ? '<div class="card-status-row"><span class="card-status deleted">Deleted tweet</span></div>'
      : '';

    var div = document.createElement('div');
    div.className = 'card verdict-' + d.verdict;
    div.innerHTML = '<div class="card-head">'
      + '<span class="card-date">' + d.date + '</span>'
      + '<span class="card-user"><a href="' + tweetUrl + '" target="_blank">' + d.user + checkBadge + '</a></span>'
      + '<span class="card-cat ' + catClass + '">' + d.cat + '</span>'
      + viewsHtml
      + '</div>'
      + statusBadge
      + '<div class="card-tweet">' + d.text + '</div>'
      + '<div class="reply-link"><a href="' + tweetUrl + '" target="_blank" rel="noopener">View on X \u2192</a></div>'
      + '<div class="card-grok-section">'
      + '<span class="card-verdict ' + d.verdict + '">' + vLabel + '</span>'
      + '<div class="card-stats">'
      + '<span class="card-count"><strong>' + d.count + '</strong> groks (' + pct + '% of daily total)</span>'
      + '<div class="card-minibar">'
      + '<div class="mb-false" style="width:' + bw(d.vc.false) + '%"></div>'
      + '<div class="mb-true" style="width:' + bw(d.vc.true) + '%"></div>'
      + '<div class="mb-mixed" style="width:' + bw(d.vc.mixed) + '%"></div>'
      + '</div></div>'
      + '<div class="card-reply-wrap">'
      + '<button class="card-reply-btn" onclick="toggleReply(this)">Median Grok reply</button>'
      + '<div class="card-reply-text">' + d.reply + '</div>'
      + '</div>'
      + '</div>';
    wrap.appendChild(div);
  });

  // Add clamp fade to overflowing tweets
  document.querySelectorAll('.card-tweet').forEach(function(el) {
    if (el.scrollHeight > el.clientHeight + 2) {
      el.classList.add('clamped');
    }
  });
})();
</script>
</body>
</html>
