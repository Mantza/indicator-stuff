<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Browse Meta's Political Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: compact embed for a ~650px article column. Topic bars (2 columns) on top, filters, then a scrolling list of note cards. Single light look to match beehiiv. */
:root{
  --blue:#2451C9; --blue-ink:#1B3E9C; --blue-wash:#EAF0FC; --yellow:#ECBB2D; --yellow-wash:#FDF5DC;
  --ink:#1A1D24; --ink2:#525A6B; --line:#E3E7EF; --bg:#FFFFFF; --panel:#F6F8FC;
  --f:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; --mono:'Roboto Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink);margin:0}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{font:15px/1.45 var(--f);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
h1{font:900 22px/1.15 var(--f);margin:4px 0 2px;text-wrap:balance}
.sub{color:var(--ink2);font-size:13.5px;margin:0}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:1px 16px}
@media (max-width:520px){.topics{gap:1px 8px}.tb{font-size:12px}}
.tb{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;padding:2px 6px;border-radius:4px;font-size:13px;line-height:1.25}
.tb .bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:3px;overflow:hidden}
.tb .bar i{display:block;height:100%;background:var(--blue)}
.tb .ct{font:500 12px var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.tb:hover{background:var(--panel)} .tb:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.tb[aria-pressed="true"]{background:var(--blue-wash)} .tb[aria-pressed="true"] .bar i{background:var(--blue-ink)}
.tb[aria-pressed="true"] .lab{font-weight:700;color:var(--blue-ink)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls input[type=search]{flex:1 1 180px;min-width:0;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.controls select{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.status{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2)}
.status button{all:unset;cursor:pointer;color:var(--blue);font-weight:500}
.list{height:330px;overflow-y:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.card{padding:11px 2px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font:12px var(--mono);color:var(--ink2);align-items:center}
.pill{font:500 11px var(--f);padding:2px 7px;border-radius:999px;background:var(--blue-wash);color:var(--blue-ink)}
.pill.fab{background:var(--yellow-wash);color:#6B4E00}
.note{margin:0;font-size:14.5px;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}
.links a{color:var(--blue);text-decoration:none} .links a:hover{text-decoration:underline}
.links .k{color:var(--ink2)}
.more{all:unset;cursor:pointer;align-self:center;margin:10px 0;padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--blue);font-weight:500}
.empty{padding:24px 0;color:var(--ink2);text-align:center}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
footer a{color:var(--blue);font-weight:500;text-decoration:none}
footer img{height:16px;width:auto;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <div>
    <div class="eyebrow">Meta Community Notes tracker</div>
    <h1>What Meta’s Community Notes said about US politics</h1>
    <p class="sub" id="sub">Loading the notes…</p>
  </div>
  <div class="topics" id="topics" role="group" aria-label="Filter by topic"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search notes, e.g. Talarico, ballots, ICE" aria-label="Search notes">
    <select id="app" aria-label="App"><option value="">All apps</option><option value="F">Facebook</option><option value="I">Instagram</option><option value="T">Threads</option></select>
    <select id="sort" aria-label="Sort"><option value="e">Most engaged</option><option value="d">Newest</option></select>
  </div>
  <div class="status"><span id="count"></span><button id="reset" hidden>Clear filters</button></div>
  <div class="list" id="list" aria-live="polite"></div>
  <footer>
    <span><a id="dl" href="https://docs.google.com/spreadsheets/d/1iqJBMHgthid2uCUlSmQwWs8o9NOgn8njgt0x7UfRZxk/edit?usp=sharing" target="_blank" rel="noopener">All notes (Google Sheet)</a> · Engagement = likes + comments + shares when we visited the post</span>
    <a href="https://indicator.media/" target="_blank" rel="noopener" aria-label="Indicator"><img src="wordmark.svg" alt="Indicator"></a>
  </footer>
</div>
<script>
const PN={F:'Facebook',I:'Instagram',T:'Threads'};
const S={t:'',q:'',app:'',sort:'e',shown:25};
let N=[],L={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return 'link'}};
const fmt=n=>n==null?'':n.toLocaleString('en-US');
const mon=d=>{const [y,m,dd]=d.split('-');return ['Jan.','Feb.','March','April','May','June','July','Aug.','Sept.','Oct.','Nov.','Dec.'][+m-1]+' '+(+dd)};
function filtered(){
  const q=S.q.trim().toLowerCase();
  return N.filter(n=>(!S.t||n.t===S.t)&&(!S.app||n.p===S.app)&&(!q||(n.n+' '+n.an+' '+n.a).toLowerCase().includes(q)));
}
function renderTopics(){
  const base=N.filter(n=>(!S.app||n.p===S.app));
  const c={};base.forEach(n=>c[n.t]=(c[n.t]||0)+1);
  const keys=Object.keys(L).filter(k=>c[k]).sort((a,b)=>c[b]-c[a]);const max=Math.max(...keys.map(k=>c[k]),1);
  $('topics').innerHTML=keys.map(k=>`<button class="tb" data-t="${esc(k)}" aria-pressed="${S.t===k}"><span class="lab">${esc(L[k])}</span><span class="ct">${c[k]}</span><span class="bar"><i style="width:${(100*c[k]/max).toFixed(1)}%"></i></span></button>`).join('');
}
function card(n){
  const acct=n.an||n.a;
  const src=n.s.length?`<span class="k">Sources:</span>${n.s.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(host(u))}</a>`).join('')}`:'<span class="k">No sources listed</span>';
  return `<article class="card"><div class="meta"><span>${mon(n.d)}</span><span>${PN[n.p]}</span>${acct?`<span>${esc(acct)}</span>`:''}${n.e!=null?`<span>${fmt(n.e)} engagements</span>`:''}<span class="pill">${esc(L[n.t])}</span>${n.f?'<span class="pill fab">Fabricated quote or image</span>':''}</div>
  <p class="note">${esc(n.n)}</p><div class="links">${n.u?`<a href="${esc(n.u)}" target="_blank" rel="noopener">Open post ↗</a>`:''}${src}</div></article>`;
}
function render(){
  renderTopics();
  let r=filtered();
  r.sort(S.sort==='e'?(a,b)=>(b.e??-1)-(a.e??-1):(a,b)=>b.d.localeCompare(a.d));
  $('count').textContent=`${r.length.toLocaleString('en-US')} note${r.length===1?'':'s'}${S.t?' in '+L[S.t]:''}`;
  $('reset').hidden=!(S.t||S.q||S.app);
  const list=$('list');
  list.innerHTML=r.length?r.slice(0,S.shown).map(card).join('')+(r.length>S.shown?`<button class="more" id="more">Show more (${(r.length-S.shown).toLocaleString('en-US')} left)</button>`:''):'<div class="empty">No notes match. Clear a filter or try another word.</div>';
}
$('topics').addEventListener('click',e=>{const b=e.target.closest('.tb');if(!b)return;S.t=S.t===b.dataset.t?'':b.dataset.t;S.shown=25;$('list').scrollTop=0;render()});
$('q').addEventListener('input',e=>{S.q=e.target.value;S.shown=25;render()});
$('app').addEventListener('change',e=>{S.app=e.target.value;S.shown=25;render()});
$('sort').addEventListener('change',e=>{S.sort=e.target.value;S.shown=25;render()});
$('reset').addEventListener('click',()=>{Object.assign(S,{t:'',q:'',app:'',shown:25});$('q').value='';$('app').value='';render()});
$('list').addEventListener('click',e=>{if(e.target.id==='more'){S.shown+=25;render()}});
fetch('meta-cn-browse-notes.json').then(r=>r.json()).then(j=>{N=j.notes;L=j.meta.labels;
  const m=j.meta;$('sub').textContent=`${m.n_pol.toLocaleString('en-US')} notes about US politics, out of ${m.n_all.toLocaleString('en-US')} Meta published from ${mon(m.start)} to ${mon(m.end)}, 2026. Click a topic to filter.`;
  render();}).catch(()=>{$('sub').textContent='The notes could not be loaded. Reload the page to try again.'});
</script>
</html>
