<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1win Template Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #2451C9; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

  /* Top bar with scroll buttons */
  .top-bar-wrap { display: flex; align-items: center; flex-shrink: 0; background: rgba(36,81,201,0.95); border-bottom: 1px solid rgba(255,255,255,0.1); padding-left: 14px; }
  .nav-label { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; color: rgba(255,255,255,0.5); white-space: nowrap; flex-shrink: 0; }
  .scroll-btn { flex-shrink: 0; width: 36px; height: 52px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: rgba(255,255,255,0.5); font-size: 22px; cursor: pointer; transition: color 0.15s; }
  .scroll-btn:hover { color: #ECBB2D; }
  .scroll-btn.hidden { visibility: hidden; }
  .top-bar { display: flex; align-items: center; padding: 10px 6px; gap: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; flex: 1; scroll-behavior: smooth; }
  .top-bar::-webkit-scrollbar { display: none; }
  .pill { padding: 8px 16px; border-radius: 18px; font-size: 18px; font-weight: 700; border: 2px solid rgba(255,255,255,0.25); background: transparent; color: rgba(255,255,255,0.7); cursor: pointer; white-space: nowrap; transition: all 0.15s; min-width: 42px; text-align: center; }
  .pill:hover { border-color: rgba(236,187,45,0.5); color: #fff; }
  .pill.active { background: #ECBB2D; color: #000; border-color: #ECBB2D; font-weight: 700; }

  .viewer { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; user-select: none; }

  .viewer img { max-height: 100%; max-width: 100%; object-fit: contain; transition: opacity 0.2s; }

  /* Navigation arrows — always visible, prominent */
  .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 5; width: 48px; height: 48px; border-radius: 50%; background: rgba(236,187,45,0.9); color: #000; border: none; font-size: 22px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .nav-arrow:hover { background: #ECBB2D; transform: translateY(-50%) scale(1.1); }
  .nav-arrow:active { transform: translateY(-50%) scale(0.95); }
  .nav-arrow.left { left: 16px; }
  .nav-arrow.right { right: 16px; }
  .nav-arrow.disabled { opacity: 0.2; pointer-events: none; }

  .tap-zone { position: absolute; top: 0; bottom: 80px; width: 40%; cursor: pointer; z-index: 3; }
  .tap-zone.left { left: 0; }
  .tap-zone.right { right: 0; }

  .progress-bar { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 3px; padding: 8px 12px; z-index: 4; }
  .progress-seg { flex: 1; height: 2.5px; border-radius: 2px; background: rgba(255,255,255,0.2); overflow: hidden; }
  .progress-seg.done { background: rgba(255,255,255,0.8); }
  .progress-seg.current { background: rgba(255,255,255,0.4); }
  .progress-seg.current .fill { display: block; height: 100%; background: #ECBB2D; border-radius: 2px; }

  .info-bar { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px; background: linear-gradient(transparent, rgba(36,81,201,0.9)); z-index: 3; }
  .info-handle { font-size: 15px; font-weight: 700; }
  .info-handle a { color: #fff; text-decoration: none; }
  .info-handle a:hover { text-decoration: underline; }
  .info-badge { display: inline-block; font-size: 10px; font-weight: 700; color: #ECBB2D; background: rgba(236,187,45,0.2); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
  .info-meta { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 3px; }
  .info-template { font-size: 13px; color: rgba(255,255,255,0.8); font-weight: 600; margin-bottom: 4px; }

  .counter { position: absolute; top: 18px; right: 16px; font-size: 12px; color: rgba(255,255,255,0.6); font-weight: 600; z-index: 5; font-variant-numeric: tabular-nums; }

  /* Swipe hint animation on first load */
  .swipe-hint { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.6); border-radius: 20px; padding: 8px 16px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.8); animation: hintFade 3s ease-in-out forwards; pointer-events: none; }
  .swipe-hint .arrows { color: #ECBB2D; font-size: 16px; }
  @keyframes hintFade { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; display: none; } }

  @media (max-width: 640px) {
    .tap-zone { width: 35%; }
    .nav-arrow { width: 40px; height: 40px; font-size: 18px; }
    .nav-arrow.left { left: 10px; }
    .nav-arrow.right { right: 10px; }
  }
</style>

const imgPathName = {
  "Template 1": "Shopping",
  "Template 2": "Tube_dress",
  "Template 3": "Leopard_dress",
  "Template 4": "Red_dress",
  "Template 5": "Beach_walk",
  "Template 6": "Maid_outfit",
  "Template 7": "Yoga_pose",
  "Template 8": "Hide_face",
  "Template 9": "Cobblestone_street",
};
const imgPath = (tpl, acct) => {
  const folder = imgPathName[tpl] || tpl.replace(/ /g, '_');
  return `screenshots/individual posts/templated/${folder}--${acct}.png`;
};

const fmtDate = d => {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
};

const tplNames = Object.keys(templates);
let currentTpl = 0;
let currentIdx = 0;

const nav = document.getElementById('nav');
const mainImg = document.getElementById('mainImg');
const progress = document.getElementById('progress');
const counter = document.getElementById('counter');
const infoBar = document.getElementById('infoBar');

// Build nav pills
tplNames.forEach((name, i) => {
  const pill = document.createElement('div');
  pill.className = 'pill' + (i === 0 ? ' active' : '');
  pill.textContent = (i + 1);
  pill.onclick = () => { currentTpl = i; currentIdx = 0; render(); scrollPillIntoView(i); };
  nav.appendChild(pill);
});

// Scroll buttons for template nav
const scrollL = document.getElementById('scrollL');
const scrollR = document.getElementById('scrollR');
scrollL.onclick = () => { nav.scrollBy({ left: -120, behavior: 'smooth' }); };
scrollR.onclick = () => { nav.scrollBy({ left: 120, behavior: 'smooth' }); };

function updateScrollBtns() {
  scrollL.classList.toggle('hidden', nav.scrollLeft <= 4);
  scrollR.classList.toggle('hidden', nav.scrollLeft >= nav.scrollWidth - nav.clientWidth - 4);
}
nav.addEventListener('scroll', updateScrollBtns);
window.addEventListener('resize', updateScrollBtns);
setTimeout(updateScrollBtns, 50);

function scrollPillIntoView(i) {
  const pills = nav.querySelectorAll('.pill');
  if (pills[i]) pills[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

function render() {
  const name = tplNames[currentTpl];
  const arr = templates[name];
  const item = arr[currentIdx];

  // Nav pills
  nav.querySelectorAll('.pill').forEach((p, i) => p.classList.toggle('active', i === currentTpl));

  // Image
  mainImg.src = imgPath(name, item.acct);
  mainImg.alt = `@${item.acct} – ${name}`;
  mainImg.onclick = () => window.open(item.url, '_blank');
  mainImg.style.cursor = 'pointer';

  // Progress segments
  progress.innerHTML = arr.map((_, i) => {
    const cls = i < currentIdx ? 'done' : i === currentIdx ? 'current' : '';
    return `<div class="progress-seg ${cls}">${i === currentIdx ? '<div class="fill"></div>' : ''}</div>`;
  }).join('');

  // Counter
  counter.textContent = `${currentIdx + 1} / ${arr.length}`;

  // Info
  const isFirst = currentIdx === 0;
  infoBar.innerHTML = `
    <div class="info-template">${name}</div>
    <div class="info-handle"><a href="https://www.instagram.com/${item.acct}/" target="_blank">@${item.acct}</a>${isFirst ? '<span class="info-badge">1st poster</span>' : ''}</div>
    <div class="info-meta">${fmtDate(item.date)} · <a href="${item.url}" target="_blank" style="color:rgba(255,255,255,0.6)">view post ↗</a></div>
  `;

  // Arrow buttons
  document.getElementById('arrowL').classList.toggle('disabled', currentIdx === 0);
  document.getElementById('arrowR').classList.toggle('disabled', currentIdx >= arr.length - 1);
}

function go(dir) {
  const arr = templates[tplNames[currentTpl]];
  const next = currentIdx + dir;
  if (next >= 0 && next < arr.length) {
    currentIdx = next;
    render();
    // Dismiss hint on first interaction
    const hint = document.getElementById('swipeHint');
    if (hint) hint.style.display = 'none';
  }
}

document.getElementById('tapLeft').onclick = () => go(-1);
document.getElementById('tapRight').onclick = () => go(1);
document.getElementById('arrowL').onclick = () => go(-1);
document.getElementById('arrowR').onclick = () => go(1);

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowUp') { currentTpl = Math.max(0, currentTpl - 1); currentIdx = 0; render(); scrollPillIntoView(currentTpl); }
  else if (e.key === 'ArrowDown') { currentTpl = Math.min(tplNames.length - 1, currentTpl + 1); currentIdx = 0; render(); scrollPillIntoView(currentTpl); }
});

// Touch swipe
let touchX = 0;
document.getElementById('viewer').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
document.getElementById('viewer').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
});

// Preload adjacent images
const preloadCache = {};
function preload() {
  const arr = templates[tplNames[currentTpl]];
  [-1, 1].forEach(d => {
    const ni = currentIdx + d;
    if (ni >= 0 && ni < arr.length) {
      const src = imgPath(tplNames[currentTpl], arr[ni].acct);
      if (!preloadCache[src]) { preloadCache[src] = new Image(); preloadCache[src].src = src; }
    }
  });
}
const origRender = render;
render = function() { origRender(); preload(); };

render();
