g children and get them to think twice about the consequences of excessive screen time? That may be a stretch. But at least it gives them something to watch that\u2019s not as mind numbing as Cocomelon.", "dnn_url": "https://podcasts.apple.com/us/podcast/toy-story-5-nostalgia-vs-tech/id1831466851?i=1000750684885&amp;uo=4", "dnn_title": "Toy Story 5: Nostalgia vs Tech", "dnn_meta": "2026-02-20 16:39 &middot; Lag: 14m after", "dnn_text": " On February 20th, here&#x27;s the latest in technology news. Back in 1995, when the first Toy Story movie hit theaters, Google didn&#x27;t even exist yet, and Apple was teetering on the edge of. bankruptcy. No one dream Pixar would still be churning out Toy Story films over 30 years later. Now the trailer for Toy Story 5 pits worn out favorites like a balding woody and buzz light year against the sinister new villain, an evil AI tablet called Lily Pad. The story brings back classic toys, such as Mrs. Potato Head, Rex and Slingke Dog, all facing off against the creeping threat of modern technology. Bonnie, the little girl who inherited Andy&#x27;s toys after college, is outside playing when a surprise package delivers the shiny new tablet right to her. Doorstep. She gets instantly glued to the screen, barely glancing up even when her parents call time on screen time. The device chimes in with an eerie robotic voice, claiming it&#x27;s always listening, and it eerily echoes one of Jesse&#x27;s old lines before translating it. Into Spanish. Jesse pulls woody aside, and warns him that tech has invaded their home, and they&#x27;re losing Bonnie to this glowing gadget. Woody fires back the toys are meant for play, while tech sings built for absolutely everything else. Fans are buzzing about this fresh take on toys versus screens, blending nostalgia with a timely nod to our gadget obsessed world. Toy Story 5 promises more heartfelt adventures when it hits theaters. Dean in a sponsored by our partner, check out the episode description. It looks like a pillow, it sounds like headphones, build for comfort and sound. S-O-L-I, solely pillow.com."}, {"source": "TechCrunch", "semantic": 0.903, "media_url": "https://techcrunch.com/2026/02/18/dg-matrix-raises-60m-to-make-data-center-power-smarter/", "media_title": "DG Matrix raises $60M to make data center power smarter", "media_meta": "2026-02-18 04:30", "media_text": "Data centers face a conundrum: how to power increasingly dense server racks using equipment that relies on century-old technology.\nTraditional transformers are bulky and hot, but a new generation of solid-state transformers promises to address both problems while making power management more flexible.\nOne solid-state transformer startup,DG Matrix, has raised $60 million in a Series A round, TechCrunch has exclusively learned. Engine Ventures led the round with ABB, Cerberus Ventures, Chevron Technology Ventures, Clean Energy Ventures, Fine Structure Ventures, Helios Climate Ventures, MCJ, and Piedmont Capital participating.\nThe company also recently announced a deal to provide its Interport device to Exowatt, the startupbuilding solar-plus-storage containersto supply data centers with 24/7 electricity.\nThe Interport device acts as a router for power, Subhashish Bhattacharya, co-founder and CTO of DG Matrix, told TechCrunch. One Interport can handle up to 2.4 megawatts of connections. For example, it could accumulate 600 kilowatts from solar panels and 600 kilowatts from grid-scale batteries to feed power to 12 racks drawing 100 kilowatts each.\nBecause Interport can integrate electricity from a variety of sources, including large batteries, DG Matrix says it can eliminate uninterruptible power supplies (UPS) and the equipment needed to support them.\nAltogether, one Interport can cut down the amount of space devoted to power conversion in a data center. Two 4-by-30-foot skids laden with power conversion equipment can be replaced by a single four-by-four-foot Interport device, DG Matrix co-founder and CEO Haroon Inam told TechCrunch.\nBy eliminating several devices, the company can boost the system\u2019s overall efficiency. All the legacy devices chained together can achieve about 82% to 90% efficiency, Inam said, while Interport is 95% to 98% efficient. He said that reliability should improve, too. \u201cWhen you are using only 10%, 15% of the components that legacy is using, y\n\n[... 2,861 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/dg-matrix-raises-%2460m-for-solid-state-transformers/id1831466851?i=1000750317840&amp;uo=4", "dnn_title": "DG Matrix Raises $60M for Solid-State Transformers", "dnn_meta": "2026-02-18 13:22 &middot; Lag: 52m after", "dnn_text": " Hey, it&#x27;s Cory with Tech News today. The biggest tech stories every day. Data centers are facing a tough challenge powering their super dense server racks without dated equipment that&#x27;s over a century old. Traditional transformers are bulky, run hot, and limit flexibility, but a new wave of SalisDate transformers is changing that. One startup called DG Matrix just raised $60 million in a series A funding round, led by engine ventures with backers like ABB, Chevron, technology ventures, and others. The company also aimed to deal to supply its interport device to ExoWet, which builds solar plus storage containers for round the clock data center, power. Interport works like a smart router for electricity, handling up to 2.4 MW from mixed sources. For example, it can blend 600 kW from solar panels and 600 kW from big batteries to feed 12 server racks, pulling one, 100 kW each. This setup lets data centers ditch bulky, uninterruptible power supplies and all the gear they need. The impact is huge on space too. DG Matrix says, one compact 4x4 foot interport can replace two massive 4x30 foot skids full of power conversion equipment, freeing, up room for more servers. They&#x27;re rolling out initial units to customers this June, with a sidecar product next to directly po ia_title": "Tesla dodges 30-day suspension in California after removing \u2018Autopilot\u2019", "media_meta": "2026-02-17 20:07", "media_text": "The California Department of Motor Vehicles will not suspend Tesla\u2019s sales and manufacturing licenses for 30 days because the EV maker has stopped using the term \u201cAutopilot\u201d in the marketing of its vehicles in the state.\nThe decision,issued late Tuesday, means Tesla can continue selling its EVs in California without interruption and officially settles a case that has been dragging on for nearly three years. California is Tesla\u2019s biggest U.S. market.\nIn November 2023, the DMV filed accusations that Tesla violated state law by using deceptive marketing of Autopilot, its basic advanced driver-assistance system, as well as its more capable Full Self-Driving driver-assistance software. The state regulator argued that the terms misled customers and distorted the capabilities of the advanced driver-assistance systems.\nTesla stopped using the term \u201cFull Self-Driving Capability\u201d and instead used Full Self-Driving (Supervised) to more accurately describe the system and clarify that drivers were still required to monitor it. But Tesla held on to the Autopilot term, prompting the DMV to refer the case to an administrative law judge at the California Office of Administrative Hearings.\nIn December, the administrative law judge agreed with the DMV\u2019s request to suspend Tesla\u2019s sales and manufacturing licenses in the state for 30 days as a penalty for its actions. The DMV agreed with the ruling but didn\u2019t pounce; instead, the state regulator gave Tesla 60 days to comply.\n\u201cSince then, Tesla took corrective action and has stopped using the misleading term \u2018Autopilot\u2019 in the marketing of its electric vehicles in California,\u201d the DMV stated in a release posted on its website. \u201cTesla had previously modified its use of the term \u2018Full Self-Driving\u2019 to clarify that ograms like North Carolina State University&#x27;s C-3 partnership and the University of North Carolina at Chapel. Hills C-Step, but on a smaller scale at first. The focus is on low-income students from the local Durham community, especially North Carolina residents. Duke already offers tuition-free attendance for families in North Carolina and South Carolina making under $150,000 a year. This new path aims to spot talent everywhere and provide the support needed to succeed. Looking ahead, both sides want to expand beyond engineering, maybe even to Duke&#x27;s Trinity College. They&#x27;re planning scholarships, mentoring, and a dedicated staff position to help students build confidence and connections before transferring. Boosting economic mobility for the whole region. The daily news now is powered by our sponsor. A pillow that plays your podcasts, music, or white noise privately. No \n\n[... 2,040 chars total]"}, {"source": "Duke Chronicle", "semantic": 0.891, "media_url": "https://www.dukechronicle.com/article/duke-fencing-acc-championship-recap-title-elgeziry-tolba-boroditsky-glasson-shen-koo-burk-ermakov-20260223", "media_title": "Duke men&#x27;s fencing wins ACC Championship with late tiebreaker, women finish runner-up", "media_meta": "2026-02-23", "media_text": "For many, it would have been enough to beat the reigning national champion, Notre Dame. It would have been enough to beat an archrival, North Carolina. But that wasn\u2019t enough for Duke.\nAn opening loss to a lower-ranked team, an afternoon upset of the No. 1 team in the nation and an emotionally-charged tiebreaker fence-off capped off Duke\u2019s men\u2019s fencing&#x27;s run to a third conference title, the first for head coach Omar Elgeziry. Coming in as the second-to-last seed, no one expected this ending. The men finished 3-1 as they fenced their way to the top finish in Cameron Indoor Stadium, while the women&#x27;s team finished 3-1 as runner-up to an undefeated Notre Dame squad.\n\u201cI r h Carolina to finish three wins and one loss on top. The women&#x27;s team also went three in one but settled for runner-up behind the undefeated fighting Irish. It kicked off with a tough loss to Boston College but the blue devils turned it around fast. The edge Notre Dame in a thrilling 14-13 match then took on North Carolina with everything on the line. Down the stretch and foil, Joseph Glasson scored the decisive touch against Peter Brook to clinch it at 13-10. Tied with Boston College at three and one, Duke won the title in a high-stakes fence off. They sent out their top fensers, Lev Irmakov in Sabre, Ethan Borditsky in Eppie, and Abdo Raman Toba in foil, and dominated to seal the deal. The crowd roared as teammates mobbed Toba after his win. Coach El-Gaziri could barely speak through the emotion, overwhelmed by the home victory. Fans packed Cameron got louder as the stakes rose, feeding off the rivalry energy. The women fought hard too, crushing Stanford 18-9, Boston College 19-8, and North Carolina 15-12 before Nother. Dame proved too strong again. This marched the women&#x27;s fifth straight runner up to the top ranked Irish. Both squad saved their best for team events and now head to the NCAA Mid-Atlantic South Regional on March 7th in Haverford, Pennsylvania. Strong showings there could punch tickets to Nationals hosted by Notre Dame later in March. D&amp;N is brought to you by our sponsor. Some chase peace. I put my head in it. S-O-L-I-SOLYPILLOW.COM"}, {"source": "TechCrunch", "semantic": 0.89, "media_url": "https://techcrunch.com/2026/02/17/adani-pledges-100b-for-ai-data-centers-as-india-seeks-bigger-role-in-global-ai/", "media_title": "Adani pledges $100B to build AI data centers as India seeks bigger role in the global AI race", "media_meta": "2026-02-17 05:08", "media_text": "Indian conglomerate Adani Group said on Monday it would invest $100 billion over the next decade to build data centers specialized for AI across the country, a move that unders 9s new interface is now rolling out in the US", "media_meta": "2026-02-17 07:58", "media_text": "Amazon is rolling out a new user interface for its Fire TV streaming devices, designed to put more focus on the content, while also simplifying navigation. The update, which is initially available to Fire TV owners in the U.S., represents the first major Fire TV redesign in years.\nThe changes arrive after an explosion of streaming content has made it more difficult to know what\u2019s available to watch on which service, requiring streaming platforms like Fire TV to serve more as a discovery hub than just a tool to launch streaming apps.\nThe companyfirst previewed the new designat the Consumer Electronics Show in Las Vegas in January, showing off an interface intended to make Fire TV feel less cluttered. The updated design features rounded corners, varied gradients, consistent typography, and increased spacing between content, and it adds more space for pinned apps.\nPreviously, Fire TV users could only pin six apps to the home screen. Now, with smaller app icons, the update expands that to 20 slots for apps, accommodating services like Netflix, Disney+, YouTube, Prime Video, Hulu, HBO Max, and other top streamers.\nIn addition, the navigation bar at the top of the screen has been simplified into categories marked with simple icons, including \u00a0Movies, TV, Live TV, Sports, and News. The search button is also easily within reach to the left of the Home tab.\nWithin these tabs, Fire TV surfaces the content you\u2019re already watching and displays other suggestions drawn from the services you\u2019ve subscribed to, organized in rows labeled \u201cFor You.\u201d The tabs also highlight free movies to stream, top movies and shows, and other paid content you might enjoy.\nThe Live TV tab, meanwhile, centralizes access to the live content that\u2019s available across your streaming services, plus broadcast or cable TV, if you subscribe or use an antenna.\nLess frequently rs to share posts on the app to their Instagram Stories \u2014 a move that could capitalize on Instagram\u2019s larger user base to bring more people to Meta\u2019s X competitor.\nThe companyannouncedon Thursday a new feature that lets you share a Threads post to your Instagram Story without having to leave the Threads app, instead previewing how the post would look on your Story directly within the Threads app.\nThe app previously allowed you to share anyone\u2019s Threads post to your Instagram Story similar to how you would reshare someone\u2019s Instagram post to your Story. It also already offered tools for sharing posts to your Instagram Feed or DMs.\nMeta\u2019s text-first, Twitter-like app Threads firstlaunched in July 2023and benefited from its ties with Instagram to rapidly grow its initial user base. To sign up, users had to authenticate with their Instagram credentials, which allowed Threads to populate with account details, like username, bio, and photo, as well as verification status and followers.\nWith one tap, users could immediately follow the accounts they already followed on Instagram \u2014 and those not on Threads would get a notification that someone had added them.\nIn the months and years following its launch, Meta has heavily leaned on its other, bigger social platforms to continue to grow Threads, including bydisplaying popular Threads posts on Facebookand adding a similar carousel ofThreads posts to Instagram users. The company also made it easy for users tocross-post from Instagram and Facebook to Threads, which also helped boost adoption.\nThese moves have paid off. Data from market intelligence provider Similarweb last month indicated thatThreads is now seeing more daily usagethan Elon Musk\u2019s X on mobile devices. (X still dominates on the web, however.) Threads\u2019 numbers overall have\n\n[... 2,236 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/threads-surpasses-x-in-mobile-usage-new-instagram-story/id18314668 uncedon Wednesday. Etsy says the deal will allow it to focus on its own marketplace.\nThe deal comes nearly five years afterEtsy acquired Depopfor $1.62 billion, at a time when secondhand clothing apps weregaining in popularity.\nFounded in 2011, Depop generated approximately $1 billion in gross merchandise sales \u2014 the total value of goods sold through its platform \u2014 in 2025. In the U.S., the company saw nearly 60% year-over-year growth. As of December 31, 2025, the marketplace had seven million active buyers, nearly 90% of whom were under 34, and more than three million active sellers.\n\u201cDepop has built a trusted, social-forward marketplace with strong momentum in the pre-loved fashion category, and we are confident that as part of eBay, Depop will be even more well-positioned for long-term growth, benefiting from our scale, complementary offerings, and operational capabilities,\u201d said eBay CEO Jamie Iannone in thepress release.\nThe move comes as Etsy has struggled to grow its business after the pandemic-era e-commerce boom, competing with marketplaces like Temu and Shein, as well as Amazon.\nThe company\u2019s year-over-year revenue grew 2.2% in 2024, down from 7.1% growth reported in 2023. Etsy is scheduled to release its 2025 earnings on Thursday.\n\u201cWe are excited that this transaction allows us to focus exclusively on the compelling opportunity we see in front of us: to grow the Etsy marketplace in ways that matter most to our buyers and sellers,\u201d said Etsy CEO Kruti Patel Goyal in the press release. \u201cWe are proud of what the Depop team has built \u2013 a truly differentiated brand and product, grounded in clear purpose and strong community \u2013 becoming one of the fastest-growing fashion resale marketplaces in the U.S. I am confident that Depop is well-positioned for its next phase of growth as part of eBay.\u201d\nThe sale is the latest in a pattern of\n\n[... 2,333 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/etsy-sells-depop-to-ebay-for-%241-2b/id1831466851?i=1000750389580&amp;uo=4", "dnn_title": "Etsy Sells Depop to eBay for $1.2B", "dnn_meta": "2026-02-18 23:23 &middot; Lag: 27m after", "dnn_text": " It&#x27;s February 18th. Here&#x27;s your tech news in two minutes. Etsy just announced it&#x27;s selling its second hand clothing app, D-POP to eBay for $1.2 billion in cash. The deal lets Etsy zero in on its main marketplace for handmade and vintage goods. D-POP, popular with Gen Z and millennials, was bought by Etsy almost five years ago for $1.62 billion when resale apps were exploding. D-POP started in 2011 and hit about $1 billion in gross merchandise sales last year. In the US, it grew nearly 60% year over year, with 7 million active buyers, 90% under age 34, and over 3 million. Sellers. Etsy leaders say they&#x27;re proud of D-POP&#x27;s community and social vibe in pre-love fashion, and they believe eBay&#x27;s scale will boost it even more. Meanwhile, Etsy&#x27;s been facing tough competition from spots like T-MU, Sheen, and Amazon, with revenue growth slowing to 2.2% last year. This sale fits Etsy&#x27;s pattern of snapping of niche sites and later selling them off, like Brazil&#x27;s ELO7 and the music gear side, Reverb. Etsy&#x27;s chief exec is excited to double down on what buyers and sellers love most. The deal should close in the second quarter of this year, right after Etsy drops its 2025 earnings on Thursday. Support for this D-N-N episode comes from our sponsor. Some travel miles to fine piece, I just climb into bed and listen."}, {"source": "TechCrunch", "semantic": 0.871, "media_url": "https://techcrunch.com/2026/02/19/spacexs-starbase-city-is-getting-its-own-court/", "media_title": "SpaceX\u2019s Starbase city is getting its own court", "media_meta": "2026-02-19 11:55", "media_text": "SpaceX\u2019s company town in Texas, Starbase, is less than a year old, but it already has its ownvolunteer fire departmentand is working oncreating a police department. Now it wants its own court, too.\nStarbase\u2019s city administrator submitted aproposed ordinanceto the city commission during a meeting on Wednesday that would create a municipal court with a part-time judge, prosecutor, and court clerk. Starbase\u2019s mayor will serve as the judge until one is appointed to a two-year term. The administrator wrote that he hopes to have a candidate ready by next month\u2019s meeting.\nThe formation of a court within Starbase, which currently claims around 580 residents and sits adjacent to SpaceX\u2019s South Texas rocket factory and launch facility, is the latest in a series of steps the city has taken to build up its own municipal services.\nIn addition to the volunteer fire department, Starbase is also now handling its own building permits and fire code inspections. And when a plan to contract local county sheriff\u2019s deputies to patrol the city fell apart, the citydecided instead to start up the Starbase Police Department. (The city is still paying the Cameron County Sheriff\u2019s Department to use its jail facilities, though, according to paperwork filed ahead of Wednesday\u2019s meeting.)\nStarbase is still in the process of establishing the police department, and it expects that process could take around six months.\nDuring Wednesday\u2019s meeting, the city commission reviewed an application to the Texas Commission on Law Enforcement that is required to stand up the police force. That application revealed some new details about the plans for the new Starbase Police Department.\nThe city wrote that its expanding population has led to an increase in calls for service. Across 2025, there were 420 calls to law enforcement in the city, 180 calls for fire service, and 140 EMS calls, according to the application. There were also 353 crashes documented in the area last year, with more than 7,000 vehicles trave\n\n[... 2,978 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/starbase-building-its-own-co  March 2020, are back with a new take on weather forecasting. The team recently announced the launch of their new app,Acme Weather, which they claim offers a better and more reliable forecast than the one they had at Dark Sky. The app will also offer a range of unique weather notifications, including fun ones like alerts about rainbows and beautiful sunsets.\nUnlike typical weather apps, Acme Weather\u2019s forecast is supplemented with a range of alternate predictions for better accuracy.\nDark Sky co-founder Adam Grossman explains in an introductoryblog postthat the app\u2019s homegrown forecasts will leveragedifferentnumerical weather prediction models, satellite data, ground station observations, and radar data, making its forecast fairly reliable.\nHowever, the app will also feature additional forecast lines that show the other possible outcomes as gray lines on its graphs.\n\u201cForecasts are often wrong \u2014 it\u2019s the weather, right? It\u2019s one of the hardest things to predict,\u201d Grossman told TechCrunch via a telephone interview. \u201cAnd our biggest pet peeve with a lot of weather apps is you just get their best guess, and you don\u2019t know how certain they are.\u201d\nHaving an understanding of the alternatives helps people plan for big events, he noted.\n\u201cI find it most useful for winter storms, where, maybe the storm starts out in the morning, and you\u2019re going to get snow, but maybe there\u2019s also a possibility it holds out a little bit later \u2014 to the afternoon \u2014 in which case it\u2019s rain,\u201d Gross explained. \u201cBeing able to just see that right there on the timeline just gives you this intuitive sense of whether, do all the models agree, and you\u2019re getting snow? Or do half of them say snow and half of them say rain?\u201d he says.\nThis type of weather data could make for a valuable product, not just for consumers, but for other developers, too.\nAt Dark Sky, the team had offered its weather API to d e, software, and power electronics for large-scale systems used in data centers. And industrial applications. Data centers have exploded thanks to AI, but connecting to the power grid can take five years or more. This created huge demand for quick solutions like Redwoods, Claire McConnell. The company&#x27;s vice president of business development says AI is a top focus alongside renewables like solar and wind. On Thursday, Redwood announced a $425 million Series E funding round. New investor Google joined existing backer Nvidia to scale up energy storage deployments. This cash will help meet the surge in data center needs. The first customer is Crusoe with a system delivering 12 megawatts and 63 megawatt hours from recycled EV batteries. Bigger projects are coming, including hyperscalers planning hundreds of megawatt hours or even gigawatt hours. It&#x27;s a smart pivot turning waste into power for the AI era. Dean in his sponsor by our partner, check out the episode description. Your favorite podcasts, music, or sleep sounds coming from your pillow. No earbuds, no distractions, just listen and relax. S-O-L-I-SOLYPILO.COM"}, {"source": "Duke Chronicle", "semantic": 0.851, "media_url": "https://www.dukechronicle.com/article/duke-university-student-government-sofc-committee-election-bylaws-20260219", "media_title": "DSG senators approve election bylaws, announce plan to list course material costs in DukeHub", "media_meta": "2026-02-19", "media_text": "Duke Student Government senators approved election bylaws for the upcoming election cycle and approved SOFC\u00a0funding during their Wednesday meeting.\u00a0Senators also announced that estimated costs for course materials will show up in DukeHub starting as early as next semester in an attempt to address potential financial burdens faced by students.\nJunior Olivia McConnell, vice president of the academic affairs committee, told the senate that as early as next semester, estimated costs for materials required in class an social media for children", "media_meta": "2026-02-17 07:59", "media_text": "Over the past few months, several countries have announced plans to restrict social media access for children and teens. Australiabecame the firstto implement such measures at the end of last year, setting a precedent that other countries are now closely watching.\nAustralia\u2019s regulations, along with other countries\u2019 proposals, aim to reduce the pressures and risks that young users may face on social media, which include cyberbullying, addiction, mental health issues, and exposure to predators.\nOf course, there are concerns about privacy regarding invasive age verification and excessive government intervention. Critics, includingAmnesty Tech, have said such bans are ineffective and that they ignore the realities of younger generations. Despite this, many nations are moving ahead with proposed legislation.\nWe\u2019ve compiled a list of countries that are considering or have already moved forward with bans on social media for young users.\nAustralia became the world\u2019s first country toban social mediafor children under 16 in December 2025. The ban blocks children from using Facebook, Instagram, Snapchat, Threads, TikTok, X, YouTube, Reddit, Twitch, and Kick. It notably doesn\u2019t include WhatsApp or YouTube Kids.\nThe Australian government has said these social media companies must take steps to keep children off their services.\u00a0Companies that fail to comply may face penalties of up to $49.5 million AUD ($34.4 million USD).\nThe government says these platforms should use multiple verification methods to ensure that people using their services are older than 16. It also notes that they can\u2019t rely on users simply entering their own age.\nDenmark isset to bansocial media platforms for children under 15. The Danish government announced in November 2025 that it had secured support  for the ban from three governing coalition parties and two opposition parties in parliament.\nThe government\u2019s plans could become law as soon as mid-2026, according to the Associated Press.\u00a0The Danish digital \n\n[... 3,933 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/australias-social-media-ban-a-global-trend/id1831466851?i=1000750178338&amp;uo=4", "dnn_title": "Australia&#x27;s Social Media Ban: A Global Trend", "dnn_meta": "2026-02-17 16:50 &middot; Lag: 50m after", "dnn_text": " From the Daily News Now Network, this is Corey with Tech News Today. Australia made history last December as the first country to ban social media for kids under 16. The law blocks access to big platforms like Facebook, Instagram, Snapchat, TikTok, and YouTube for anyone that young. Companies must verify ages using tough methods, not just self-reported info or face finds up to 49,500,000 Australian dollars. Now other nations are jumping in. Denmark plans a ban for under 15s by mid-2026, complete with a new app for age checks. France passed the similar bill in its lower house for kids under 15, backed by President Macron to cut screen time. Germany, Greece, Malaysia, Slovenia, Spain and the United Kingdom are all considering bans around age 15 or 16. Spain wants to hold executives personally responsible for hate speech too, while the UK is talking to parents and kids about limiting addictive. Features like endless scrolls. These moves aim to shield young users from cyberbullying, addiction, mental health struggles, and online predators. Parents and experts worry social media harms developing brains with studies showing links to anxiety and poor sleep. Lawmakers say enforcement starts with tech companies, but challenges remain. Like kids using fake ages or VPNs. As more countries watch Australia&#x27;s rollout, expect global pressure on platforms to prioritize child safety over profits. The Daily News Now is powered by our sponsor, Link in the description. Do not just fall asleep, drift into what you are listening to. S-O-L-I-SallyPillow.com"}, puter vision. Last month, the firmreleaseda new open source model Kimi K2.5 and a coding agent.\nMiniMax\u2019s 13 million exchanges targeted agentic coding and tool use and orchestration. Anthropic said it was able to observe MiniMax in action as it redirected nearly half its traffic to siphon capabilities from the latest Claude model when it was launched.\nAnthropic says it will con\n\n[... 4,366 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/anthropic-accuses-chinese-ai-firms-of-model-theft/id1831466851?i=1000751074320&amp;uo=4", "dnn_title": "Anthropic Accuses Chinese AI Firms of Model Theft", "dnn_meta": "2026-02-23 20:20 &middot; Lag: 22m after", "dnn_text": " TechStore is making headlines on February 23rd, and Foropic is accusing three Chinese AI companies of creating more than 24,000 fake accounts to scrape its clawed model. The firms, DeepSeek, Moonshot AI, and Minimax allegedly generated over 16 million exchanges using a technique called distillation. This method lets them copy clawed strengths in agentic reasoning, tool use, and coding to boost their own models. distillation is a standard way labs make smaller, cheaper versions of their AI, but rivals can use it to steal ideas. Open AI recently warned lawmakers that DeepSeek did something similar with its products. Meanwhile, DeepSeek shook things up a year ago with its open source R1 model, which rival top US labs at low cost, and it&#x27;s about to drop DeepSeek. V4. Said to be clawed in ChadgPT, encoding. These accusations hit amid heated debates on US export controls for advanced AI chips to China. Experts like Demetri AlPairovich from Silverado Policy Accelerator say it&#x27;s no surprise, calling it theft, that&#x27;s fueled China&#x27;s fast AI progress. He argues it strengthens the case against selling chips to these companies. The attacks varied in scale. DeepSeek ran over 150,000 exchanges focused on logic and handling sensitive queries. Moonshot AI hit more than 3.4 million, targeting reasoning, tools, and vision, right before launching its KimiK 2.5 model. Many max win biggest with 13 million, siphoning coding skills from clawed&#x27;s latest version, and theropic plans to beef up defenses against these raids and urges the whole industry, cloud providers, and policy makers to team up. They warned distillation could spread unsafe models, stripping safeguards against bio weapons or cyber threats, especially of open source for. Authoritarian uses. TechCrunch reached out to the companies for common, but no word yet. Quick thanks to today&#x27;s sponsor. See the description for more. A pillow that plays your sound quietly, comfortably, effortlessly. Built for nighttime listening, S-O-L-I,\n\n[... 2,019 chars total]"}, {"source": "Duke Chronicle", "semantic": 0.849, "media_url": "https://www.dukechronicle.com/article/duke-university-panel-on-grief-policy-bereavement-leave-north-carolina-20260218", "media_title": "\u2018Honor that they lived\u2019: Duke affiliates explore grief from a personal and policy angle", "media_meta": "2026-02-18", "media_text": "Duke community members gathered Monday afternoon for a unique event in the Sanford School of Public Policy \u2014 a panel on grief, informed by both personal stories and policy research.\nAt the event, co-hosted bySanford Wellness\u2019sMental Health Mondays andSanford Women in Policy, the panelists envisioned grief-informed bereavement leave, better education about grief and impactful local and state-level advocacy.\nThe panel featured Cassidie Bates, a Sanford Master of Public Policy candidate researching grief policy, Rebecca Feinglos, the founder ofGrieve Leaveand Professor of Medicine Tony Galanos, who focuses on grief management. The panel was moderated by Ariel Keller, a second-year graduate student and president of Sanford Women in Policy.\nAt different points in their lives, Bates, Feinglos and Galanos, were all on the receiving end of an unexpected phone call, telling them a loved one had suddenly died.\nBates lost her father, John, to a sudden cardiac event when she was 25. As the only child of her unmarried father, she became the sole executor for his estate.\n\u201cI did not know how to put on a funeral, I did not know how to make decisions at a morgue, I did not know how to sell a house,\u201d Bates said. \u201cThis was an experience that showed me just how little infrastructure we have to support grieving workers.\u201d\nFeinglos lost her mother, Susan, who was the former head of the Duke Medical Center Library, when she was growing up. Feinglos heard from those around her that she was doing really well, at school and later professionally.\nReflecting on how she coped, Feinglos recognized she didn\u2019t fully acknowledge her grief: \u201cWhat is grief? I\u2019ve never heard of her. All was going great,\u201d Feinglos said.\nBut when Feinglos\u2019s father, Mark, who was Chief of Duke Health\u2019s Division of Endocrinology, died suddenly on the first day of lockdown during the COVID-19 pandemic, she realized she needed to approach grief in a new way. Feinglos founded the organization Grieve Leave, which aims to foste\n\n[... 4,774 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/grief-panel-personal-stories-policy-push/id1850546613?i=1000750292771&amp;uo=4", "dnn_title": "Grief Panel: Personal Stories, Policy Push", "dnn_meta": "2026-02-18 &middot; Lag: 6.1h after", "dnn_text": " From Durham, this is your February 18th update. Duke University Community Members gathered Monday afternoon at the Sanford School of Public Policy for a powerful panel on grief. It blended personal stories with policy research. The speakers included Cassidy Bates, a master of public policy candidates studying grief policy, Rebecca Feingloss, founder of Grief Leave, and Professor Tony Galanos, an expert in grief management. Arielle Keller, a graduate student in head of Sanford Women in Policy, moderated the event. Each panel is shared how sudden loss hit them hard. Bates lost her father, John, to a cardiac event when she was 25. As his only child, she handled his estate alone. She struggled with funeral plans, more decisions, and selling his house. That experience highlighted how little support exists for grieving workers. Feingloss lost her mother young and seemed to cope well at school and work. But her father&#x27;s sudden death on the first day of COVID lockdown changed everything. She found a Grief Leave to spark conversations and provide real support. Galanos, who started Duke&#x27;s palliative care in 1998, lost his father after surgery and his son in 2018. Even with his expertise, he battled a mix of grief and guilt. The group called for better policies. There&#x27;s no federal mandate for bereavement leave, and is usually unpaid, just three to five days for immediate family only. Bates pushes for grief-informed systems that include real experiences from the start. She wants flexible, non-consecutive leave, and a broader family definition. Feingloss fought six years for North Carolina State employees to get 40 hours of protected leave, secured by a former governor&#x27;s order. They also suggested incentives for advanced care planning and grief education in schools. As Galanos put it, death ends a life, but not the relationship."}, {"source": "TechCrunch", "semantic": 0.848, "media_url": "https://techcrunch.com/2026/02/17/snapchat-launches-creator-subscription-in-the-u-s/", "media_title": "Snapchat launches creator subscriptions in the US", "media_meta": "2026-02-17 06:07", "media_text": "Social network Snapchatannouncedtoday it\u2019s launching creator subscriptions in alpha with select people in the U.S. starting on February 23. The company noted that users will be able to buy subscriptions to creators, includingJeremiah Brown,Harry Jowsey, andSkai Jackson.\u00a0This will allow users to unlock exclusive content while creating monetization opportunities for creators.\nCreators can set their own month ce as AI grew more demanding, also inspiring the recent launch ofKoyeb Sandboxes, which provide isolated environments to deploy AI agents.\nBefore the acquisition, Koyeb\u2019s platform already helped users deploy models from Mistral and others. In ablog post, Koyeb said its platform will continue operating. But its team and technology will now also help Mistral deploy models directly on clients\u2019 own hardware (on premises), optimize its use of GPUs, and help scale AI inference \u2014 the process of running a trained AI model to generate responses \u2014 according to a press release from Mistral.\nAs part of the deal, Koyeb\u2019s 13 employees and its three co-founders, Yann L\u00e9ger, Edouard Bonlieu, and Bastien Chatelard (pictured above in 2020), are set to join the engineering team of Mistral, overseen by CTO and co-founder Timoth\u00e9e Lacroix. Under his leadership, Koyeb expects its platform to transition into a \u201ccore component\u201d of Mistral Compute over the coming months.\n\u201cKoyeb\u2019s product and expertise will accelerate our development on the Compute front, and contribute to building a true AI cloud,\u201d Lacroix wrote in a statement. Mistral has been ramping up its cloud ambitions. Just a few days ago, the company announceda $1.4 billion investment in data ce\n\n[... 3,178 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/mistral-ai-acquires-koyeb-for-ai-cloud-expansion/id1831466851?i=1000750240210&amp;uo=4", "dnn_title": "Mistral AI Acquires Koyeb for AI Cloud Expansion", "dnn_meta": "2026-02-18 01:22 &middot; Lag: 8h 0m after", "dnn_text": " From the Daily News Now Network, this is Corey with Tech News Today. Mistral AI, the French powerhouse last valued at $13.8 billion, just made its first big move with an acquisition. The open AI rival has snapped up Koyab, a pair of startup that simplifies deploying AI apps at massive scale while handling all the behind the scenes. Infrastructure. This deal ramps up my straw&#x27; ear, they launched Reload, a platform to manage these digital workers like employees. This week, they unveiled their first product, Epic, and raised $2,275,000 in funding led by Anthemis. Reload helps companies connect AI agents from any source, assign roles and permissions, and track their work across teams. It accesses the main system for oversight, giving visibility into how these agents coordinate on tasks like coding and debugging. The founders previously built and sold a company together, so they know the start of world well. Teams today struggle, because agents only remember short-term prompts and lose context over time, leading to inconsistent projects. Epic fixes that by serving as an architect and coding environments like HRSA, it defines product requirements, data models, and tech decisions upfront. Then keeps a shared memory of changes so agents stay on track, no matter who, uses them. With fresh funding, Reload plans to hire more people and build infrastructure for a wave of AI agents. In a crowded field with rivals like Longchain and Crew AI, they stand out by focusing on long-term project context for the next era of work. This episode is supported by our sponsor, C Details in the description. What is cooler than cool, a pillow that plays your sound, S-O-L-I, solely pillow.com."}, {"source": "TechCrunch", "semantic": 0.838, "media_url": "https://techcrunch.com/2026/02/20/peak-xv-raises-1-3b-doubles-down-on-ai-as-global-vc-rivalry-in-india-heats-up/", "media_title": "Peak XV raises $1.3B, doubles down on AI as global VC rivalry in India heats up", "media_meta": "2026-02-20 07:10", "media_text": "Peak XVannounced on Friday that it has raised $1.3 billion across new India and Asia-focused funds. The firm, which now manages more than $10 billion in assets, is sharpening its focus on artificial intelligence and cross-border bets amid intensifying competition for deals in the region.\nThe capital will be deployed across its India seed and venture funds as we w.\u201d\nThe data collected by sensors in the company\u2019s manufacturing platform and during the simulations allows Freeform to rapidly improve production quality and quantity.\n\u201cWe have more meaningful data on the physics of the metal-printing process than any company in\n\n[... 2,844 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/freeform-raises-%2467m-for-ai-driven-metal-3d-printing/id1831466851?i=1000750485992&amp;uo=4", "dnn_title": "Freeform Raises $67M for AI-Driven Metal 3D Printing", "dnn_meta": "2026-02-19 13:15 &middot; Lag: 15m after", "dnn_text": " It&#x27;s February 19th. Here&#x27;s your tech news in two minutes. Tech investors are still chasing the dream of building physical products as fast and easy as riding software. Freeform, a startup revolutionizing metal, 3D printing, just raised $67 million in a Series B funding round. Backers include heavy hitters like Founders Fund, Nvidia&#x27;s Inventures, and 2 Sigma Ventures. The company is now valued at around $179 million. The cash will supercharge their manufacturing platform. Right now, their GoldenEye system uses 18 lasers to fuse metal powders into precise parts. The next version, called Skyfall, will crank it up with hundreds of lasers, churning out thousands of kilograms of metal components every day. The idea started back in 2018 with Founders&#x27; Erick Palich and Thomas Ronnaker. They met at SpaceX building rocket engines and got frustrated with clunky, expensive industrial printers that were built for mass production. So they designed freeform from scratch for speed and flexibility. What&#x27;s set them apart is the heavy use of artificial intelligence. They partner with Nvidia for powerful graphics processing units, right on site, running real-time physics simulations. That gives them more data on metal printing physics than anyone else, letting them boost quality and output fast. Freeform is already shipping hundreds of mission-critical parts to customers and plans to hire up to 100 new employees while expanding their facility. It&#x27;s part of a hot trend in manufacturing as a service, with rivals like Hadrian hitting billion-dollar valuations for similar tech in defense and beyond. This episode is brought to you in partnership with our sponsor. When you need a moment alone, just lay back and listen. S-O-L-I, solelypillow.com"}, {"source": "TechCrunch", "semantic": 0.83, "media_url": "https://techcrunch.com/2026/02/23/spotify-ai-prompted-playlists-uk-markets/", "media_title": "Spotify rolls out AI-powered  Prompted Playlists to the UK and other markets", "media_meta": "2026-02-23 16:50", "media_text": "After initially testing its AI-powered \u201cPrompted Playlist\u201d feature inNew Zealandand recently launching inthe U.S. and Canada, Spotifyannouncedon Monday that it\u2019s rolling out the tool to Premium subscribers in the U.K., Ireland, Australia, and Sweden.\nThe Prompted Playlist feature allows users to create custom playlists by simply describing what they want to listen to in their own words. Instead of searching for individual songs or artists, users can describe the vibe, scenario, or inspiration they want, and Spotify will take care of the rest.\nTo access the feature, users tap \u201cCreate\u201d and then select \u201cPrompted Playlist,\u201d then enter any prompt in English. The feature is designed to interpret themes including moods, aesthetics, and even memories. Prompts can be as broad or specific as the user wants, referencing musical eras, genres, activities, lyrics, instruments, or even requesting a playlist inspired by a TV show, movie, or personal milestone.\u00a0Users can also specify whether they want the playlist to include mostly new music or just music from their library in the prompt.\nOnce a prompt is submitted, Spotify\u2019s AI generates a customized playlist tailored to the request. The system draws on the user\u2019s listening history and incorporates current music and cultural trends. Plus, each song comes with a short explanation that offers insight into why it was chosen for that particular playlist.\nUsers can refine their playlists by adjusting their prompts or starting over. For those whose musical tastes constantly evolve, playlists can be scheduled to automatically refresh on a daily or weekly basis.\nBecause this is still in beta, Spotify noted that there might be changes as the company gets feedback, and that there are currently usage limits in place. Some users havereportedhitting limits after roughly 20 or 30 prompts.\nSpotify has recently expanded AI features throughout its platform, includingPage Match, which lets users scan a physical book page to jump to the corresponding\n\n[... 2,690 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/spotifys-ai-powered-playlists-easy-personalized/id1831466851?i=1000751046891&amp;uo=4", "dnn_title": "Spotify&#x27;s AI-Powered Playlists: Easy &amp; Personalized", "dnn_meta": "2026-02-23 17:09 &middot; Lag: 18m after", "dnn_text": " Here&#x27;s more tech news for February 23rd. Spotify has exciting news from music fans. On Monday, the streaming giant announced its rolling out its AI-powered prompted playlist feature to premium subscribers in the United Kingdom, Ireland, Australia, and Sweden. This comes after testing in New Zealand and a recent launch in the United States and Canada. The tool makes creating playlists super easy, just tap Create, pick prompted playlist, and type a description in English, like a viper a roadtrip, songs from the 90s inspired by a movie, or tunes, matching your mood with new tracks or from your library. Spotify&#x27;s AI handles the rest. It pulls from your listening history and current trends to build a custom mix. Each song even comes with a quick explanation of why it fits. You can tweak the prompt, start fresh, or set it to refresh daily or weekly as your taste change. Publicly users love the convenience, but since it&#x27;s still in beta, there are usage limits. Some hit them after 20 or 30 prompts. Spotify plans tweaks based on feedback to make it even better. Meanwhile, the company is going all in on AI internally. One co-CEO said their top developers have encoded since December. They&#x27;re also expanding audio books into physical book sales for users in the United States and United Kingdom right from the app. A message from our sponsor supports today&#x27;s story. A pillow that plays your sound quietly, comfortably, effortlessly, builds for nighttime listening, S-O-L-I, solely pillow.com."}, {"source": "Duke Chronicle", "semantic": 0.83, "media_url": "https://www.dukechronicle.com/article/duke-university-professor-nimmi-ramanujam-national-academy-of-engineering-biomedical-pratt-womens-health-20260223", "media_title": "Nimmi Ramanujam elected to National Academy of Engineering for advancing women\u2019s health", "media_meta": "2026-02-23", "media_text": "Nimmi Ramanujam, Robert W. Carr, Jr. distinguished professor of biomedical engineering and director of the Center for Global Women\u2019s Health Technologies, waselectedto the 2026 class of the National Academy of Engineering.\nThe decision, announced in February, represents one of the highest awards given to engineers. Ramanujam joins a group of 130 engineers from the United States and 28 international members for the 2026 class. She is the 13th Duke engineering professor and second biomedical engineering professor to hold the honor.\nRamanujam was awarded the distinction for her work developing technologies to improve women&#x27;s health, including better cervical cancer detection and breast cancer treatment, according to the Academy\u2019s website. For Ramanujam, the accomplishment represents welcome attention to work in women\u2019s health that expands beyond her individual contributions.\n\u201cIt\u2019s nice to see that this is being brought to the forefront \u2026 that what we\u2019re doing is considered meaningful and impactful,\u201d she said.\nMuch of Ramanujam\u2019s work has centered on access. She has worked extensively to create tools to improve access to medical care across the United States as well as lower- and middle-income countries like Kenya and Peru.\nThrough her role as the founder and chief scientific officer of Calla Health Foundation, she developed thepocket colposcopeand thecallascope, which make cervical imaging more affordable and less invasive.\nIn 2024, Ramanujamreceivedthe Department of Defense\u2019s Innovator\u2019s Award, a $10.4 million dollar grant that will cover the next four years of her team\u2019s breast cancer research. With the money, the lab hopes to develop a new model for treatment that decreases the burden of receiving care by only requiring one visit.\nBut the technical details aren\u2019t everything, Ramanujam says. Engineering requires working through social and structural barriers to get the government to \u201cbuy into\u201d a new technology. Ramanujam advocates for this broader \u201csystems thinking\u201d a\n\n[... 3,165 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/duke-professor-honored-for-womens-health-tech/id1850546613?i=1000750955629&amp;uo=4", "dnn_title": "Duke Professor Honored for Women&#x27;s Health Tech", "dnn_meta": "2026-02-23 &middot; Lag: 0.0h after", "dnn_text": " This is Corey, here with your quick two-minute update from Durham News Today. Duke Professor Nimi Ramanujam has been elected to the 2026 class of the National Academy of Engineering. She&#x27;s a distinguished professor of biomedical engineering and director of the Center for Global Women&#x27;s Health Technologies. This honor recognizes her pioneering work on technologies for better cervical cancer detection and breast cancer treatment. She joins 130 engineers from the United States and 28 international members. Ramanujam is the 13th Duke Engineering Professor and second in biomedical engineering to earn this prestigious distinction. Her innovations focus on making healthcare more accessible, especially in lower and middle income countries, like Kenya and Peru. As founder and chief scientific officer of Calahel Foundation, she created the Pocket Culposcope and Caliscope. These tools make cervical imaging cheaper and less invasive, helping women get care without big medical setups. Ramanujam sees this award as a spotlight on women&#x27;s health efforts that go beyond one person. She stresses that engineering must tackle social and structural barriers to get governments on board with new tech. It&#x27;s about systems thinking and tailoring solutions to real community needs. In 2024, she received the Department of Defense Innovators Award, a $10,400,000 grand for the next four years. This funds her team&#x27;s breast cancer research toward a one-visit treatment model that cuts the care burden. Ramanujam also teaches project-based courses on global health and co-authored a textbook on biomedical engineering for global health. She pushes for teamwork across disciplines at Duke. Her official induction happens in fall 2026. Support for this episode comes from our sponsor, see the description, your pillow, your podcast, your moment, made for listening in bed, so L.I. solely pillow dot com."}, {"source": "Duke Chronicle", "semantic": 0.829, "media_url": "https://www.dukechronicle.com/article/duke-mens-basketball-and-one-clemson-boozer-scheyer-sarrr-ngongba-foster-evans-20260216", "media_title": "And one: Suffocating defense, disciplined play against Clemson carries Duke men&#x27;s basketball to ranked victory", "media_meta": "2026-02-16", "media_text": "Led by a stalwart defense, No. 4 Duke men\u2019s basketball claimed victory over No. 20 Clemson Saturday afternoon.The Blue Zone analyzes this ACC matchup by highlighting one player, one word and one stat from the 67-54 win:\nIn a game defined by offensive execution and defensive discipline, Isaiah Evans provided Duke with stability on both ends of the floor. The sophomore wing finished with 00", "media_text": "A world that runs on increasingly powerful AI coding tools is one where software creation is cheap \u2014 or so the thinking goes \u2014 leaving little room for traditional software companies.As one analyst reportput it, \u201cvibe coding will allow startups to replicate the features of complex SaaS platforms.\u201d\nCue the hand-wringing and declarations that software companies are doomed.\nOpen source software projects that use agents to paper over long-standing resource constraints should logically be among the first to benefit from the era of cheap code. But that equation just doesn\u2019t quite stick. In practice, the impact of AI coding tools on open source software has been far more mixed.\nAI coding tools have caused as many problems as they have solved, according to industry experts. The easy-to-use and accessible nature of AI coding tools has enabled a flood of bad code that threatens to overwhelm projects. Building new features is easier than ever, but maintaining them is just as hard and threatens to further fragment software ecosystems.\nThe result is a more complicated story than simple software abundance. Perhaps the predicted, imminent death of the software engineer in this new AI era is premature.\nAcross the board, projects with open codebases are noticing a decline in the average quality of submissions, likely a result of AI tools lowering barriers to entry.\n\u201cFor people who are junior to the VLC codebase, the quality of the merge requests we see is abysmal,\u201d Jean-Baptiste Kempf, the CEO ofthe VideoLAN Organizationthat oversees VLC, said in a recent interview.\nKempf is still optimistic about AI coding tools overall but says they\u2019re best \u201cfor experienced developers.\u201d\nThere have been similar problems forBlender, a 3D modeling tool that has been maintained as open source since 2002. Blender Foundation CEO Francesco Siddi said LLM-assisted contributions typically \u201cwasted reviewers\u2019 time and affected their motivation.\u201d Blender is still developing an official policy for AI coding too\n\n[... 5,134 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/ai-in-open-source-headaches-not-help/id1831466851?i=1000750504457&amp;uo=4", "dnn_title": "AI in Open-Source: Headaches Not Help", "dnn_meta": "2026-02-19 14:52 &middot; Lag: 52m after", "dnn_text": " It&#x27;s February 19th, and here&#x27;s what&#x27;s happening across tech right now. People once thought powerful AI coding tools would make software super cheap and wipe out traditional companies, but in the open source world, it&#x27;s not that simple. These tools lower the bar for contributions, leading to a flood of low quality code that overwhelms projects. Instead of pure abundance, open source maintainers face more headaches than help. Take VLC, the popular video player. Its CEO says, merge requests from juniors using AI are often terrible, wasting reviewers time. Over at Blender, the 3D modeling software maintained openly since 2002, leaders note that AI assisted submissions to motivate the team. They&#x27;re even crafting policies to handle this, without recommending AI for core work. Developers are pushing back hard. Earlier this month, Mitchell Hashimoto released a system to limit GitHub contributions to trusted users only, ending the open door policy. He argues AI removed the natural filter that let projects trust newcomers by default. Meanwhile, the Curl project stopped its bug bounty program after drowning in worthless AI-generated reports. On the bright side, experienced developers love AI for speeding up new features, like porting VLC code to fresh operating systems. But maintenance stays tough, especially as code bases explode in size and complexity while skilled maintainers lag behind. In the end, open source priorities stability over shiny new code clash with AI&#x27;s push for quantity. It empowers pros but doesn&#x27;t fix the shortage of maintainers. The idea that AI spells do ger policy support, expanding clinical trials, and growing investor interest. So says Phoenix Peng, who has founded not one but two BCI startups. He\u2019s a co-founder of NeuroXess, maker of BCI implants, as well as founder and CEO of noninvasive ultrasound BCI startup Gestala.\nHis belief in the potential of this market is founded on concrete action: Provinces such as Sichuan, Hubei, and Zhejiang have alreadyset medical service pricingfor BCI, speeding its inclusion in the national medical insurance system.\nOver time, he foresees the technology extending beyond medicine \u201ctreating disease\u201d to \u201chuman augmentation,\u201d he said.\n\u201cI have always maintained that neuroscience and AI are two sides of the same coin,\u201d Peng said. \u201cThey are destined for deep integration, realizing direct high-bandwidth connections between the human brain and AI. BCI will serve as the ultimate bridge between carbon-based and silicon-based intelligence. While this may sound distant, it represents an unimaginably vast market in the future.\u201d\nBut over the next three to five years, BCI use is likely to stay concentrated in healthcare, with the market reaching multibillion-dollar scale as insurance coverage expands, Peng told TechCrunch.\nIn August 2025, China\u2019s industry ministry and six other agenciesreleased a national roadmapto further speed development of BCIs. The plan targets major technical milestones by 2027, common industry standards, and a full supply chain by 2030, with the goal of building globally competitive BCI companies and supporting smaller specialized firms.\nAsked what\u2019s driving China\u2019s rapid progress in BCI, Peng told TechCrunch it comes down to four factors. The first one is strong policy support, with cross-department collabo\n\n[... 7,615 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/chinas-brain-computer-interface-revolution/id1831466851?i=1000750887315&amp;uo=4", "dnn_title": "China&#x27;s Brain-Comput intain that the science behind the original endangerment finding is solid \u2014 and that its elimination likely means more adverse health outcomes for Americans.\n\u201cGreenhouse gas regulations reduce co-pollutants, like the fine particulate matter, nit\n\n[... 6,234 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/epa-rescinds-endangerment-finding-a-major/id1850546613?i=1000749931895&amp;uo=4", "dnn_title": "EPA Rescinds Endangerment Finding: A Major Deregulatory Move", "dnn_meta": "2026-02-16 &middot; Lag: 0.9h after", "dnn_text": " In Durham, it&#x27;s February 16th, and here&#x27;s what is going on. The Environmental Protection Agency just rescinded a key rule called the Endangerment Finding. This 2009 decision let the agency regulate six common greenhouse gases under the Clean Air Act, saying they threaten public health and future generations. It formed the backbone for rules on cars, power plants, and big emitters. The Trump administration calls this the largest deregulatory move in the United States history. They say it will save $1.3 trillion and help the auto industry by easing tough rules. The White House claims it means lower car prices, more choices for buyers, and a stronger economy, with families saving about 2004. $100 on vehicles. Environmental experts at Duke University are pushing back hard. They say the science is rock solid, and dropping the finding will mean more pollution like fine particles and ozone linked to asthma, heart disease. Strokes and early deaths. That could drive up health care costs in her productivity, making the short-term savings look short-sighted. Even so, some note United States emissions have fallen since 2006, thanks to cheaper wind and solar power. The EPA argues these sectors do not make up enough of global emissions to matter much, but critics say that ignores the big picture threat to health. Law suits from states and green groups are likely next, aiming for the Supreme Court and may be overturning a  experience in AI so far, and what you do at Google.\nI\u2019ve been in AI for about two years now. I was at Anthropic for a year and a half, I\u2019ve been at Google almost half a year now. I run Vertex AI, Google\u2019s developer platform. Most of our customers are engineers building their own applications. They want access to agentic patterns. They want access to an agentic platform. They want access to the inference of the smartest models in the world. I provide them that, but I don\u2019t provide the applications themselves. That\u2019s for Shopify, Thomson Reuters, and our various customers to provide in their own domains.\nWhat drew you to Google?\nGoogle is I think unique in the world in that we have everything from the interface to the infrastructure layer. We can build data centers. We can buy electricity and build power plants. We have our own chips. We have our own model. We have the inference layer that we control. We have the agentic layer we control. We have APIs for memory, for interleaved code writing. We have an agent engine on top of that that ensures compliance and governance. And then we even\n\n[... 5,101 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/ai-at-google-cloud-unlocking-agentic-potential/id1831466851?i=1000751069623&amp;uo=4", "dnn_title": "AI at Google Cloud: Unlocking Agentic Potential", "dnn_meta": "2026-02-23 19:49 &middot; Lag: 31m after", "dnn_text": " Here&#x27;s more tech news for February 23rd. Michael Gerstenhaber is vice president of products at Google Cloud, where he focuses on vertex, the company&#x27;s unified platform for deploying enterprise, AI. From his high level view, he sees how businesses are really using AI models today, and what it will take to unlock the full power of a gentig AI, which lets systems act more independently. What drew him to Google is the company&#x27;s total vertical integration, from building data centers and power plants to designing chips, models, and even. Chat interfaces mmerce giant has halted its Blue Jay warehouse robotics project just months after unveiling the tech, as originallyreported by Business Insiderand confirmed by TechCrunch.\nBlue Jay, a multi-armed robot designed to sort and move packages, was unveiled in October for use in the company\u2019s same-day delivery facilities. At the time, the company was testing the robots at a facility in South Carolina and said it took Amazonsignificantly less time to develop Blue Jay\u2014 only about a year\u2014 than it did to develop its other warehouse robots, a speed the company credited to advancements in AI.\nAmazon spokesperson Terrence Clark told TechCrunch that Blue Jay was launched as a prototype \u2014 although that was not made clear in the company\u2019s original press release.\nThe company plans to use Blue Jay\u2019s core technology for other robotics \u201cmanipulation programs\u201d with employees who worked on Blue Jay being moved to other projects.\n\u201cWe\u2019re always experimenting with new ways to improve the customer experience and make work safer, more efficient, and more engaging for our employees,\u201d Clark told TechCrunch over email. \u201cIn this case, we\u2019re actually accelerating the use of the underlying technology developed for Blue Jay, and nearly all of the technologies are being carried over and will continue to support employees across our network.\u201d\nAmazon also unveiled the Vulcan robot last year, which is used in the storage compartments of the company\u2019s warehouses.Vulcan is a two-armed robot, with one arm meant to rearrange and move items in a compartment while the other is equipped with a camera and suction cups to grab goods. The Vulcan can allegedly \u201cfeel\u201d the objects that it touches and was trained on data gathered from real-world interactions.\nAmazon has been developing its internal robotics program since 2012 when it purchased Kiva Systems, a robotics company \n\n[... 2,152 chars total]", "dnn_url": "https://pod erge of bankruptcy. No one could have predicted that over 30 years later, Pixar would still be making Toy Story movies, nor could anyone have known that the latest installation in the franchise would pit Buzz Lightyear and a balding Woody against an evil AI tablet called Lilypad.\nBut sure enough, \u201cToy Story 5\u201d confronts old-school toys like Mrs. Potato Head, Rex, and Slinky Dog against the sinister threat oftechnology.\nThe trailer shows Bonnie, the young girl who inherited Andy\u2019s toys when he left for college in \u201cToy Story 2,\u201d playing outside with her toys when a surprise package with the Lilypad tablet arrives for her. She becomes completely enraptured by the tablet, not even looking up from the screen when her parents tell her that screen time is over.\nThe \u201cToy Story 5\u201d trailer makes the Lilypad \u2014 or, Lily \u2014 out to be a sinister villain. When Jessie confronts the tablet about Bonnie\u2019s well-being, Lily seems not to be paying attention, so the cowgirl demands that the tablet listen to her.\n\u201cI\u2019m always listening,\u201d Lily says ominously, regurgitating Jessie\u2019s impassioned speech in a computerized tone\u2026 and then translates it into Spanish.\n\u201cTech\u2019s invaded our house,\u201d Jessie tells Woody. \u201cI\u2019m losing Bonnie to this device.\u201d\nWoody replies, \u201cToys are for play, but tech is for everything.\u201d\nCould \u201cToy Story 5\u201d pull at the heartstrings of young children and get them to think twice about the consequences of excessive screen time? That may be a stretch. But at least it gives them something to watch that\u2019s not as mind numbing as Cocomelon.", "dnn_url": "https://podcasts.apple.com/us/podcast/toy-story-5-trailer-classic-toys-vs-tech-gadgets/id1831466851?i=1000750548862&amp;uo=4", "dnn_title": "Toy Story 5 Trailer: Classic Toys vs. Tech Gadgets", "dnn_meta": "2026-02-19 20:23 &middot; Lag: 20h 2m before", "dnn_text": " This is your tech update for February 19th. Disney and Pixar just dropped the first trailer for Toy Story 5, promising an epic showdown between classic toys and modern tech gadgets. Cowboy Woody reunites with his old pals after the events of Toy Story 4. He has a new bald spot in poncho, but he jumps right back into the action with Buzz Light Year in the gang. Jesse warns that tech has taken over the house, while Woody points out that toys are meant for play, but gadgets seem to do everything else. Meanwhile, little Bonnie struggles with screen time limits, glued to her tablet no matter what. When Bonnie leaves the room, the sneaky learning tablet named Lily Pad starts taunting the toys. She even tricks everyone into thinking their trash, landing them in a donation box headed for disaster. Fans are thrilled to hear familiar voices returning, like Tom Hanks as Woody, Tim Allen as Buzz, Joan Qsac as Jesse, and stars such as Annie Potts, as Bo Peep and Wallace Sean as Rex. Newcomers include Greta Lee voicing Lily Pad, Tony Hale as Forky, and even Keanu Reeves as Duke Kaboom. The full adventure hits theaters on June 19th. Catch the trailer now and stream the first four Toy Story movies on Disney Plus to get ready for the Toy Rebellion. This episode is brought to you in partnership with our sponsor. Your favorite podcasts, music or sleep sounds coming from your pillow, no earbuds, no distractions, just listen and relax. S-O-L-I-SOLYPILO.COM"}, {"source": "Duke Chronicle", "semantic": 0.716, "media_url": "https://www.dukechronicle.com/article/duke-university-nicholas-school-climate-environmental-protection-federal-supreme-court-faculty-20260216", "media_title": "Duke climate scholars warn of legal, financial risks following EPA \u2018endangerment finding\u2019 repeal", "media_meta": "2026-02-16", "media_text": "The Environmental Protection Agencyrescindeda major rule underpinning the country\u2019s federal climate regulations on Thursday. The move comes amid an ongoing campaign by the Trump administration to reverse U.S. climate change mitigation efforts.\nKnown as the \u201cendangerment finding,\u201d the principle empowered the EPA to regulate six common greenhouse gases under the Clean Air Act by asserting they pose a risk to \u201cthe public health and welfare of current and future generations.\u201d Since it was set in 2009, that finding has served as the basis for a slew of regulations governing the climate impact of cars, power plants and other large emitters.\nNow, the government is doing away with the finding in a move it\u2019scelebratingas \u201cthe single largest deregulatory action in U.S. history.\u201d But environmental scholars have condemned the change as worrisome, and policy experts have cast doubts on the economic claims predicting trillions of dollars saved.\nThe EPA has largely framed the rescission around lessening regulation of the U.S. auto industry, which the Trump administration haslong claimedis overly cumbersome.\nEPA Administrator Lee Zeldin began discussing the matter with the White House abouta year agoalthough the agency did not make aninitial proposaluntil July 2025. The proposal stated that motor vehicle and engine manufacturers would be released from their obligation to measure, report and control the greenhouse gas emissions of their products.\nFollowing the EPA\u2019s approval of the rule, the White House has touted the shift as beneficial to both auto manufacturers and consumers,arguingthat it \u201cclears the path for lower prices, greater consumer choice and a thriving economy\u201d and that it will save$1.3 trillion.\nEnvironmental scholars at Duke maintain that the science behind the original endangerment finding is solid \u2014 and that its elimination likely means more adverse health outcomes for Americans.\n\u201cGreenhouse gas regulations reduce co-pollutants, like the fine particulate matter, nit\n\n[... 6,234 chars total]", "dnn_url": "https://api.fastcast.ai/audio/f7a23563-cdf4-4aff-a129-810b66cd7e66.mp3", "dnn_t icks, shaving air for years ahead. This episode is supported by our sponsor. Some people meditate. I just lay down and press play, S-\n\n[... 2,019 chars total]"}, {"source": "TechCrunch", "semantic": 0.715, "media_url": "https://techcrunch.com/2026/02/21/wikipedia-blacklists-archive-today-after-alleged-ddos-attack/", "media_title": "Wikipedia blacklists Archive.today after alleged DDoS attack", "media_meta": "2026-02-21 12:20", "media_text": "Wikipedia editors have decided to remove all links to Archive.today, a web archiving service that they said has been linked to more than 695,000 times across the online encyclopedia.\nArchive.today \u2014 which also operates under several other domain names, includingarchive.isandarchive.ph\u2014 is perhaps most widely used to access content that\u2019s otherwise inaccessible behind paywalls. That also makes it useful as a source for Wikipedia citations.\nHowever, according tothe Wikipedia discussion page about this topic, \u201cThere is consensus to immediately deprecate archive.today, and, as soon as practicable, add it to the spam blacklist\u00a0\u2026 and to forthwith remove all links to it.\u201d (Ars Technicafirst reported on the decision.)\nThe discussion page says that Archive.today was previously blacklisted in 2013, only to be removed from the blacklist in 2016.\nWhy reverse course again? Because, the discussion page says, \u201cWikipedia should not direct its readers towards a website that hijacks users\u2019 computers to run a DDoS attack.\u201d Plus, \u201cevidence has been presented that archive.today\u2019s operators have altered the content of archived pages, rendering it unreliable.\u201d\nThe distributed denial of service (DDoS) attack in question was allegedly directed at blogger Jani Patokallio. Patokallio wrote that beginning on January 11, users who loaded the archive\u2019s CAPTCHA page have beenunknowingly loading and executing JavaScriptthat sends a search request to his Gyrovague blog, in an apparent ticians discussed economic disparities, the mistreatment of workers and lobbying\u2019s corruption of American politics at both local and national levels.\nOn March 3, Allam will face incumbent Rep. Valerie Foushee for the second time in anexpensive, contentious race. Allam \u2014 currently the vice chair of Durham\u2019s Board of County Commissioners and thefirst Muslim American womanelected to office in the state \u2014 represents a progressive contrast to Foushee, which gained Sanders\u2019 attention.\nSanders started the \u201cFighting Oligarchy\u201d tour in February 2025, and said Durham marked his 37th stop. He haswarnedof the United States\u2019s trajectory toward an \u201coligarchic form of society\u201d since as early as 2024 andstarted the tourto \u201creach people where they are.\u201d\nResidents from across the state turned up to support Allam\u2019s candidacy. Their reasons were similar: She represents a change.\nTrudy, Mark and Sheri, three members ofEngaged Defenders 4 Democracy, a grassroots organization whose protests have populated the state\u2019s bridges, said they came to Sanders\u2019 rally to support Allam\u2019s candidacy, and to personally hand-deliver a donation to her campaign.\n\u201cShe\u2019s not taking money from corporations,\u201d Mark said. \u201cShe is someone who is very well prepared, but she is a calming influence that still moves things along.\u201d\nSheri said she liked that Allam \u201cis someone who is not going to take no for an answer.\u201d\nKelly, a volunteer for the event, said she\u2019s excited about Allam\u2019s stance on health care.\n\u201cI\u2019ve been waiting for a candidate wh\n\n[... 7,790 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/bernie-sanders-rallies-for-progressive-candidate-in-nc/id1850546613?i=1000749931287&amp;uo=4", "dnn_title": "Bernie Sanders Rallies for Progressive Candidate in NC", "dnn_meta": "2026-02-16 &middot; Lag: 0.9h after", "dnn_text": " In Durham, it&#x27;s February 16th and here&#x27;s what is going on. On Friday afternoon, more than 1,000 people filled the Grand Ballroom at the Durham Convention Center to hear Vermont Senator Bernie Sanders on, his fighting oligarchy tour. It was his 37th stop since kicking off in February 2025. Durham County Commissioner Nita Allum joined him on stage, building buzz for her upcoming primary challenge in North Carolina&#x27;s fourth district. Allum, the vice-chair of Durham&#x27;s Board of County Commissioners and the first Muslim American woman elected to office in the state, faces incumbent. Representative Valerie Fushie on March 3rd. The race has gotten heated and expensive, with Allum pitching herself as the true progressive option that caught Sanders&#x27; eye. The crowd pulsed with a mix of anger over economic gaps, worker mistreatment, and big money in politics. All supporters raved about Allum steering clear of corporate cash, staying tough on key issues like Medicare for All and bringing calm leadership. Grassroots groups showed up strong, even handing over personal donations. In her speech, Allum opened up about the grief from the 2015 Chapel Hill shooting that killed three Muslim students she knew, calling out, politicians for downplaying in. She hammered Fushie for taking donations from companies like Walmart, Lockheed Martin, and AstraZeneca. Learning how anyone can fight for bold. Changes while pocketing that money. Sanders fired up the room against billionaire greed, Trump-era policies, runaway military spending, and AI threatening jobs like Amazon drivers. Nearly everyone raised hands agreeing, America wants no part of authoritarianism. He wrapped with hope, saying tough times, like the Great Depression built unity and strength. We can do it again. This episode is brought to you by our sponsor. See the episode description. Head in, sound on, mites out. That is the routine. S-O-L-I-SOLY-PILLOW.com."}, {"source": "TechCrunch", "semantic": 0.691, "media_url": "https://techcrunch tion like an editor, offering headline suggestions, fact checks, and other grammar and editing suggestions. This aspect is available through the block notes editor that arrived in WordPress 6.9, where you\u2019re able to collaborate with teammates in the editor. Now you can pull the AI into that workflow by typing @ai followed by your requests. The AI will provide its answers here, including relevant links and other information where it cites external sources.\nMeanwhile, for help with visuals, the assistant leverages Google Gemini\u2019s Nano Banana AI models, which can be used to either make new images or edit existing ones. With the AI helper, available as a new \u201cGenerate Image\u201d button \n\n[... 2,513 chars total]", "dnn_url": "https://podcasts.apple.com/us/podcast/wordpress-unveils-ai-assistant-for-easy-site-management/id1831466851?i=1000750246124&amp;uo=4", "dnn_title": "WordPress Unveils AI Assistant for Easy Site Management", "dnn_meta": "2026-02-18 02:25 &middot; Lag: 10h 14m after", "dnn_text": " Tech Stories Making Headlines on February 18th. WordPress is rolling out a new Optin AI Assistant starting this Tuesday, making it easier for users to tweak their websites right inside the site. Editor and Media Library. This handy tool lets you generate images, edit and translate text, and even reorganize your site with simple prompts. In the site editor, there&#x27;s a sidebar where you can chat with the AI to swap fonts, create new pages, or refine images using Google&#x27;s Imogen. Technology. It keeps things straightforward, so no need for extra plugins or complicated steps. This builds on the block notes feature from WordPress&#x27;s 6.9 update back in December, where you can tag the AI with, at sign AI in your note. For example, ask it to edit a specific text block or suggest the catchy headline and it jumps right in. To get started, just head to your site settings and toggle on AI tools. It&#x27;s fully opt in for privacy. Sites built with WordPres let shown = new Set();
let currentIdx = -1;

function scoreColor(s) {
  if (s >= 0.9) return { bg: '#FEE2E2', color: '#DC2626' };
  if (s >= 0.8) return { bg: '#FFF7ED', color: '#EA580C' };
  if (s >= 0.7) return { bg: '#FEF3C7', color: '#D97706' };
  return { bg: '#F3F4F6', color: '#6B7280' };
}

function badgeColor(source) {
  return source === 'TechCrunch' ? '#2451C9' : '#7C3AED';
}

function showRandom() {
  const card = document.getElementById('card');
  card.classList.add('fade');
  
  setTimeout(() => {
    // Pick a random pair (try to avoid repeats until all shown)
    if (shown.size >= PAIRS.length) shown.clear();
    let idx;
    do { idx = Math.floor(Math.random() * PAIRS.length); } while (shown.has(idx) && shown.size < PAIRS.length);
    shown.add(idx);
    currentIdx = idx;
    
    const p = PAIRS[idx];
    const sc = scoreColor(p.semantic);
    
    document.getElementById('badge').textContent = p.source;
    document.getElementById('badge').style.background = badgeColor(p.source);
    document.getElementById('score').textContent = 'Semantic: ' + p.semantic.toFixed(3);
    document.getElementById('score').style.background = sc.bg;
    document.getElementById('score').style.color = sc.color;
    
    document.getElementById('media-title').innerHTML = '<a href="' + p.media_url + '" target="_blank">' + p.media_title + '</a>';
    document.getElementById('media-meta').textContent = p.media_meta;
    document.getElementById('media-text').innerHTML = p.media_text;
    
    document.getElementById('dnn-title').innerHTML = '<a href="' + p.dnn_url + '" target="_blank">' + p.dnn_title + '</a>';
    document.getElementById('dnn-meta').textContent = p.dnn_meta;
    document.getElementById('dnn-text').innerHTML = p.dnn_text;
    
    document.getElementById('pair-num').textContent = shown.size;
    
    card.classList.remove('fade');
  }, 200);
}
