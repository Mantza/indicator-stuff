": "r", "L": {"k": "empty", "h": ""}, "R": {"k": "add", "h": "==== Healthcare ===="}}, {"t": "r", "L": {"k": "del", "h": "The New York Times describes Shah as a moderate Democrat. During his tenure in the Arizona Legislature, he had a reputation for working across party lines and finding common ground with Republicans. He supports reducing the cost of health care and prescription drugs, expanding access to pre-kindergarten, and encouraging the construction of affordable housing through federal incentives in Arizona. He has also supported securing the U.S.-Mexico border."}, "R": {"k": "empty", "h": ""}}, {"t": "r", "L": {"k": "empty", "h": ""}, "R": {"k": "add", "h": "In 2019 when speaking at a healthcare panel that the Democratic Socialists for America organized Shah advocated for a “universal, single-payer” Medicare for All program and added that this policy position &quot;drew him&quot; to supporting Bernie Sanders for president. Shah has since  away from Medicare for All, instead supporting a public option healthcare system. "}}, {"t": "r", "L": {"k": "empty", "h": ""}, "R": {"k": "add", "h": "==== Border Security ===="}}, {"t": "r", "L": {"k": "empty", "h": ""}, "R": {"k": "add", "h": "Shah has stated that he supports securing the U.S.-Mexico border, pointing to his work in the state legislature and claiming that &quot;I worked with both parties to increase border security.&quot; However, critics have pointed out that he initially voted against the Arizona Border Security Fund in 2022."}}, {"t": "r", "L": {"k": "empty", "h": ""}, "R": {"k": "add", "h": "==== Taxes and economy ===="}}, {"t": "r", "L": {"k": "empty", "h": ""}, "R": {"k": "add", "h": "Shah opposes the tariffs imposed by the second Trump administration, saying they raise the cost of everyday goods, and has pledged to work to roll them back if elected to Congress. During his 2024 campaign, Shah said he would vote against renewing the Trump-era tax cuts stating during a debate that &quot;I’m not in favor of extending the Trump tax cuts because a lot of the folks that were helped by those were wealthy.&quot;"}}, {"t": "r", "L": {"k": "empty", "h": ""}, "R": {"k": "add", "h": "==== LGBTQ+ and Transgender issues===="}}, {"t": "r", "L": {"k": "empty", "h": ""}, "R": {"k": "add", "h": "In 2022, Shah voted against Senate Bill 1165, which bars transgender girls from competing on girls&#x27; school sports teams. The bill was signed into law by Governor Doug Ducey that year. He also voted against a 2022 bill banning gender-affirming surgery for minors and a 2023 bill restricting transgender people&#x27;s use of school restrooms.<span class=\"ref\">[ref]</span>"}}, {"t": "r", "L": {"k": "ctx", "h": "== Personal life =="}, "R": {"k": "ctx", "h": "== Personal life =="}}]}], "ts": "2026-09-21T06:36:51Z"}, {"ids": ["1377209070"], "date": "28 Sep", "user": "4hgoat", "page": "Amish Shah", "what": "Added his 2016 Republican primary vote for Trump and that he “has been described by his opponents as a socialist”.", "status": "Undone", "edits": [{"id": "1377209070", "from": 1377183482, "title": "Amish Shah", "ts": "2026-09-28T08:55:56Z", "delta": 1262, "rows": [{"t": "r", "L": {"k": "ctx", "h": "== Political positions =="}, "R": {"k": "ctx", "h": "== Political positions =="}}, {"t": "r", "L": {"k": "del", "h": "Shah <del>is</del> <del>described</del> by the New York Times as a moderate Democrat. "}, "R": {"k": "add", "h": "Shah <ins>has</ins> <ins>been labeled</ins> by the New York Times as a moderate Democrat. <ins>During the 2016 presidential election, Shah was temporarily registered as a Republican in New York and voted for Donald Trump in the 2016 Republican Party presidential primaries.<span class=\"ref\">[ref]</span> Additionally Shah has been described by his opponents as a socialist due to him supporting the Bernie Sanders 2020 presidential campaign and supporting Medicare for All.<span class=\"ref\">[ref]</span></ins>"}}, {"t": "r", "L": {"k": "ctx", "h": "==== Healthcare option that would allow people to buy into Medicare, rather than a single-payer system."}, "R": {"k": "add", "h": "In 2019 when speaking at a healthcare panel <ins>that the Democratic Socialists of America helped organize</ins> Shah advocated for a <ins>“universal</ins>, single-<ins>payer”</ins> Medicare for All program and added that this policy position led him to support Bernie Sanders for president in 2020. For his 2026 campaign, Shah supports a public option that would allow people to buy into Medicare, rather than a single-payer system."}}, {"t": "r", "L": {"k": "ctx", "h": "=== Border security ==="}, "R": {"k": "ctx", "h": "=== Border security ==="}}, {"t": "r", "L": {"k": "ctx", "h": "Shah supports securing the US-Mexico border. He initially voted against the 2022 state budget that established the Arizona Border Security Fund, citing inadequate education funding, but voted in 2023 for a bipartisan budget that included $200 million for border security and increased education funding."}, "R": {"k": "ctx", "h": "Shah supports securing the US-Mexico border. He initially voted against the 2022 state budget that established the Arizona Border Security Fund, citing inadequate education funding, but voted in 2023 for a bipartisan budget that included $200 million for border security and increased education funding."}}]}], "ts": "2026-10-09T21:58:04Z"}, {"ids": ["1381009071", "1381008907"], "date": "19 Oct", "user": "Miztheliz", "page": "Jay Feely", "what": "Removed “and politician” from his first sentence and added that Doug Ducey and Kyrsten Sinema had endorsed him.", "status": "Undone", "edits": [{"id": "1381008907", "from": 1379964602, "title": "Jay Feely", "ts": "2026-10-19T12:00:45Z", "delta": 459, "rows": [{"t": "r", "L": {"k": "ctx", "h": "==2026 U.S. House campaign=="}, "R": {"k": "ctx", "h": "==2026 U.S. House campaign=="}}, {"t": "r", "L": {"k": "ctx", "h": "{{for|main article|2026 United States House of Representatives elections in Arizona#District 1}}"}, const W = 'https://en.wikipedia.org/w/index.php?';

const t0 = Date.parse('2026-09-10'), t1 = Date.parse('2026-10-30');
const pos = ts => ((Date.parse(ts) - t0) / (t1 - t0) * 100).toFixed(2) + '%';

function tl() {
  const el = $('tl');
  let lastP = -99, run = 0;
  DATA.forEach((d, k) => {
    const b = document.createElement('button');
    const p = parseFloat(pos(d.ts));
    run = (p - lastP < 2.5) ? run + 1 : 0; lastP = run ? lastP : p;
    b.className = 'tl-dot'; b.style.left = run ? 'calc(' + lastP + '% + ' + (run * 15) + 'px)' : p + '%';
    b.title = d.date + ' · ' + d.page; b.setAttribute('aria-label', 'Edit ' + (k + 1) + ': ' + d.date + ', ' + d.page);
    b.onclick = () => go(k);
    el.appendChild(b);
  });
  [['2026-09-14', '14 Sep', 'first'], ['2026-09-21', '21 Sep', 'mid'], ['2026-10-26', '26 Oct', 'last']].forEach(([d, l, c]) => {
    const s = document.createElement('div'); s.className = 'tl-lab ' + c; s.style.left = pos(d); s.textContent = l; el.appendChild(s);
  });
}

function diffHTML(e) {
  let h = '<div class="diff"><div class="dh"><div>Before</div><div>After</div></div><div class="dbody">';
  let hasCtx = false;
  for (const r of e.rows) {
    if (r.t === 'gap') { h += '<div class="gap ctx-row" style="display:none"></div>'; continue; }
    const ctx = r.L.k === 'ctx' && r.R.k === 'ctx';
    if (ctx) hasCtx = true;
    h += '<div class="dr' + (ctx ? ' ctx-row' : '') + '"><div class="c ' + r.L.k + '">' + r.L.h + '</div><div class="c ' + r.R.k + '">' + r.R.h + '</div></div>';
  }
  h += '</div>';
  const side = (s, cls) => {
    const cells = e.rows.filter(r => r.t === 'r' && r[s].k !== 'empty' && r[s].h.trim());
    const changed = cells.some(r => r[s].k !== 'ctx');
    return changed ? cells.map(r => '<div class="c ' + r[s].k + '">' + r[s].h + '</div>').join('')
                   : '<div class="none">' + (cls === 'b' ? 'Nothing here before the edit.' : 'Removed entirely.') + '</div>' +
                     cells.map(r => '<div class="c ctx">' + r[s].h + '</div>').join('');
  };
  h += '<div class="stk"><div class="stk-h b">Before</div>' + side('L', 'b') + '<div class="stk-h a">After</div>' + side('R', 'a') + '</div>';
  h += '</div>';
  if (hasCtx) h += '<button class="toggle" onclick="this.previousElementSibling.classList.toggle(\'full\');this.textContent=this.previousElementSibling.classList.contains(\'full\')?\'Show changed lines only\':\'Show surrounding text\'">Show surrounding text</button>';
  return h;
}

function fmt(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('en-GB', {day: 'numeric', month: 'short', timeZone: 'UTC'}).replace('Sept','Sep') + ', ' +
    d.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit', timeZone: 'UTC'}) + ' UTC';
}

function go(k) {
  i = Math.max(0, Math.min(DATA.length - 1, k));
  const d = DATA[i];
  let h = '<div class="card"><div class="card-head"><span class="date-chip">' + esc(d.date) + '</span>' +
    '<span class="page">' + esc(d.page) + '</span><span class="by">by <b>' + esc(d.user) + '</b></span></div>' +
    '<div class="what">' + esc(d.what) + '</div>';
  const n = d.edits.length;
  if (n > 1) h += '<div class="tabs">' + d.edits.map((e, k) => '<button class="tab' + (k ? '' : ' on') + '" data-k="' + k + '">Edit ' + (k + 1) + ' of ' + n + '</button>').join('') + '</div>';
  d.edits.forEach((e, k) => {
    const link = W + 'diff=' + e.id + '&oldid=' + e.from;
    h += '<div class="edit"' + (k ? ' hidden' : '') + '><div class="edit-bar"><span>' +

  });
  h += '</div>';

}

function fixHeight() {
  const el = $('slide'); el.style.minHeight = '';
  let max = 0; const cur = i;
  for (let k = 0; k < DATA.length; k++) { go(k); max = Math.max(max, el.offsetHeight); }

}
